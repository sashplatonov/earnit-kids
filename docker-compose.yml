services:
  web:
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_NEW_RELIC_BROWSER_ENABLED: ${VITE_NEW_RELIC_BROWSER_ENABLED:-false}
        VITE_NEW_RELIC_BROWSER_INFO: ${VITE_NEW_RELIC_BROWSER_INFO:-}
        VITE_NEW_RELIC_BROWSER_INIT: ${VITE_NEW_RELIC_BROWSER_INIT:-}
        VITE_NEW_RELIC_BROWSER_LOADER_CONFIG: ${VITE_NEW_RELIC_BROWSER_LOADER_CONFIG:-}
    env_file:
      - .env
    environment:
      # Web edge
      PORT: 3000
      # Backend is reached over the Compose network, not the host loopback.
      BACKEND_URL: http://backend:${BACKEND_INTERNAL_PORT}
      APP_URL: ${APP_URL}

    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT}:3000"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - edge

  backend:
    read_only: true
    tmpfs:
      # Argon2/JNA extracts a native library during legacy Flyway migrations.
      - /tmp:rw,exec,nosuid,nodev,mode=1777
      - /opt/newrelic/logs:uid=185,gid=0,mode=0770
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.jvm
    env_file:
      - .env
    environment:
      # Backend service contract; the container listens on the internal port.
      QUARKUS_HTTP_PORT: ${BACKEND_INTERNAL_PORT}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:4174,http://localhost:4174,http://e2e.localhost:4174}
      FRONTEND_URL: ${APP_URL}
      APP_URL: ${APP_URL}
      GOOGLE_AUTH_REDIRECT_URI: ${GOOGLE_AUTH_REDIRECT_URI:-${APP_URL}/api/login-google/callback}
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: jdbc:postgresql://${DB_HOST}:${DB_INTERNAL_PORT}/${DB_NAME}
      DATA_DIR: /work/data/catalog
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-development}
      NEW_RELIC_METRICS_ENABLED: ${NEW_RELIC_METRICS_ENABLED:-false}
      NEW_RELIC_OTLP_METRICS_ENDPOINT: ${NEW_RELIC_OTLP_METRICS_ENDPOINT:-https://otlp.nr-data.net}
      NEW_RELIC_OTLP_METRICS_PROTOCOL: ${NEW_RELIC_OTLP_METRICS_PROTOCOL:-http/protobuf}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME:-earnit-kids-backend}
      NEW_RELIC_AGENT_ENABLED: ${NEW_RELIC_AGENT_ENABLED:-false}
      NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED: ${NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED:-false}
      NEW_RELIC_APPLICATION_LOGGING_FORWARDING_MAX_SAMPLES_STORED: ${NEW_RELIC_APPLICATION_LOGGING_FORWARDING_MAX_SAMPLES_STORED:-10000}
      NEW_RELIC_APPLICATION_LOGGING_LOCAL_DECORATING_ENABLED: ${NEW_RELIC_APPLICATION_LOGGING_LOCAL_DECORATING_ENABLED:-false}
    volumes:
      - earnit_kids_base_data:/work/data/catalog
    expose:
      - "${BACKEND_INTERNAL_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:${BACKEND_INTERNAL_PORT}/q/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend
      - edge
      - dokploy-ipv6

  db:
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /var/run/postgresql
    profiles:
      - db
    image: postgres:18-alpine
    environment:
      # Database
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - earnit_kids_postgres_data:/var/lib/postgresql
    # Host port mapping for Postgres is controlled via .env variables:
    #   DB_HOST_PORT (host) and DB_INTERNAL_PORT (container)
    ports:
      - "${DB_HOST_PORT}:${DB_INTERNAL_PORT}"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

volumes:
  earnit_kids_postgres_data:
  earnit_kids_base_data:

networks:
  backend:
    driver: bridge
  edge:
    driver: bridge
  # ⚠️ DO NOT REMOVE: dokploy-ipv6 — Dokploy external network for IPv6 routing.
  # Required for Dokploy reverse-proxy to reach the backend.
  dokploy-ipv6:
    external: true
