services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - .env
    environment:
      # Web edge
      PORT: ${WEB_INTERNAL_PORT}
      BACKEND_URL: http://backend:${BACKEND_INTERNAL_PORT}
      APP_URL: ${APP_URL}
      FRONTEND_URL: ${APP_URL}
      PUBLIC_BASE_URL: ${APP_URL}

    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT}:${WEB_INTERNAL_PORT}"
    expose:
      - "${WEB_INTERNAL_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:${WEB_INTERNAL_PORT}/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - edge

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.jvm
    env_file:
      - .env
    environment:
      # Backend (explicit overrides so shell vars don't shadow .env)
      QUARKUS_HTTP_PORT: ${BACKEND_INTERNAL_PORT}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5001}
      APP_URL: ${APP_URL:-http://localhost:5001}
      GOOGLE_AUTH_REDIRECT_URI: ${GOOGLE_AUTH_REDIRECT_URI:-http://localhost:5001/api/login-google/callback}
      JWT_SECRET: ${JWT_SECRET}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      DATABASE_URL: jdbc:postgresql://${DB_HOST}:${DB_INTERNAL_PORT}/${DB_NAME}
      APP_BACKUP_DIR: /work/data/backups
    volumes:
      - earnit_kids_backups:/work/data/backups
    expose:
      - "${BACKEND_INTERNAL_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:${BACKEND_INTERNAL_PORT}/q/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend
      - edge
      - dokploy-ipv6

  db:
    profiles:
      - db
    image: postgres:18-alpine
    environment:
      # Database
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - earnit_kids_postgres_data:/var/lib/postgresql/data
    # Host port mapping for Postgres is controlled via .env variables:
    #   DB_HOST_PORT (host) and DB_INTERNAL_PORT (container)
    ports:
      - "${DB_HOST_PORT}:${DB_INTERNAL_PORT}"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

volumes:
  earnit_kids_postgres_data:
  earnit_kids_backups:

networks:
  backend:
    driver: bridge
  edge:
    driver: bridge
  # ⚠️ DO NOT REMOVE: dokploy-ipv6 — Dokploy external network for IPv6 routing.
  # Required for Dokploy reverse-proxy to reach the backend.
  dokploy-ipv6:
    external: true
