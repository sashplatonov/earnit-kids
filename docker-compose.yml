services:
  coins-kids-shop:
    build: .
    container_name: coins-kids-shop
    env_file:
      - .env
    environment:
      - PORT=3000
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
