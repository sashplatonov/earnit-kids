services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    env_file:
      - .env
    environment:
      PORT: ${WEB_INTERNAL_PORT:-3000}
      BACKEND_URL: http://backend:${BACKEND_INTERNAL_PORT:-8080}
      DATABASE_URL: jdbc:postgresql://${DB_HOST:-db}:${DB_PORT:-5432}/${DB_NAME:-earnit_kids}
      PUBLIC_BASE_URL: ${APP_URL:-http://localhost:${WEB_PORT:-3000}}
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${WEB_PORT:-3000}:${WEB_INTERNAL_PORT:-3000}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:${WEB_INTERNAL_PORT:-3000}/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - edge

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        NATIVE_IMAGE_XMX: ${NATIVE_IMAGE_XMX:-2500m}
    env_file:
      - .env
    environment:
      QUARKUS_HTTP_PORT: ${BACKEND_INTERNAL_PORT:-8080}
      FRONTEND_URL: ${APP_URL:-http://localhost:${WEB_PORT:-3000}}
      JWT_SECRET: ${JWT_SECRET:-fallback-secret-for-development}
      DATABASE_URL: jdbc:postgresql://${DB_HOST:-db}:${DB_PORT:-5432}/${DB_NAME:-earnit_kids}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:${BACKEND_INTERNAL_PORT:-8080}"
    restart: unless-stopped
    networks:
      - backend
      - edge

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-earnit_kids}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - earnit_kids_postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

volumes:
  earnit_kids_postgres_data:

networks:
  backend:
    driver: bridge
  edge:
    driver: bridge
