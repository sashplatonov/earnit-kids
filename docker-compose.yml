services:
  web:
    build: .
    env_file:
      - .env
    environment:
      - PORT=3000
      - DB_SSL=false
    expose:
      - "3000"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - dokploy-ipv6

  db:
    image: postgres:18-alpine
    profiles:
      - db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - earnit_kids_postgres_data:/var/lib/postgresql
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  earnit_kids_postgres_data:

networks:
  dokploy-ipv6:
    external: true
