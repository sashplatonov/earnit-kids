services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    env_file:
      - .env
    environment:
      - PORT=${WEB_INTERNAL_PORT:-3000}
      - BACKEND_URL=http://backend:${BACKEND_INTERNAL_PORT:-8080}
      - PUBLIC_BASE_URL=${APP_URL:-http://localhost:${WEB_PORT:-3000}}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:${WEB_INTERNAL_PORT:-3000}"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:${WEB_INTERNAL_PORT:-3000}/healthz || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      - QUARKUS_HTTP_PORT=${BACKEND_INTERNAL_PORT:-8080}
      - FRONTEND_URL=${APP_URL:-http://localhost:${WEB_PORT:-3000}}
      - JWT_SECRET=${JWT_SECRET:-fallback-secret-for-development}
    ports:
      - "${BACKEND_PORT:-8080}:${BACKEND_INTERNAL_PORT:-8080}"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:${BACKEND_INTERNAL_PORT:-8080}/q/health/ready || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    profiles:
      - db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - earnit_kids_postgres_data:/var/lib/postgresql
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  earnit_kids_postgres_data:
