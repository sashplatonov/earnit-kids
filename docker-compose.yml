services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    env_file:
      - .env
    environment:
      - PORT=${WEB_INTERNAL_PORT:-3000}
      - BACKEND_URL=http://backend:${BACKEND_INTERNAL_PORT:-8080}
      - DATABASE_URL=jdbc:postgresql://${DB_HOST:-db}:${DB_PORT:-5432}/${DB_NAME:-earnit_kids}
      - PUBLIC_BASE_URL=${APP_URL:-http://localhost:${WEB_PORT:-3000}}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:${WEB_INTERNAL_PORT:-3000}"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:${WEB_INTERNAL_PORT:-3000}/healthz || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    restart: unless-stopped
    networks:
      - edge

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    # When the DB is optional (it's defined under the "db" profile),
    # avoid a hard depends_on here so composing without the profile works.
    # To start DB and make the backend wait for it, run with the profile
    # and/or use a startup/wait-for script inside the backend container.
    environment:
      - QUARKUS_HTTP_PORT=${BACKEND_INTERNAL_PORT:-8080}
      - FRONTEND_URL=${APP_URL:-http://localhost:${WEB_PORT:-3000}}
      - JWT_SECRET=${JWT_SECRET:-fallback-secret-for-development}
      - DATABASE_URL=jdbc:postgresql://${DB_HOST:-db}:${DB_PORT:-5432}/${DB_NAME:-earnit_kids}
    # Do not publish the backend port on the host to avoid port collisions.
    # The backend remains reachable by other services on the docker network.
    expose:
      - "${BACKEND_INTERNAL_PORT:-8080}"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:${BACKEND_INTERNAL_PORT:-8080}/q/health/ready || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
    restart: unless-stopped
    networks:
      - backend
      - edge
      - dokploy-ipv6

  db:
    image: postgres:18-alpine
    profiles:
      - db
    environment:
      POSTGRES_DB: ${DB_NAME:-earnit_kids}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - earnit_kids_postgres_data:/var/lib/postgresql
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    restart: unless-stopped
    networks:
      - backend
      
volumes:
  earnit_kids_postgres_data:

networks:
  backend:
    driver: bridge
  edge:
    driver: bridge
  dokploy-ipv6:
    external: true