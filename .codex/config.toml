# Codex CLI project configuration
# Agent auto-manages MCP entries — do not remove this file

[mcp_servers]

[mcp_servers.filesystem]
command = "npx"
args = [
    "-y",
    "@modelcontextprotocol/server-filesystem@latest",
    "/Users/sash/Dev/Projects/earnit-kids",
    "/Users/sash/.ai-rules"
]

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@latest"]

[mcp_servers.memory]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-memory@latest"]

[mcp_servers.sequential_thinking]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking@latest"]

[mcp_servers.ripgrep]
command = "npx"
args = ["-y", "mcp-ripgrep@latest"]

[mcp_servers.ripgrep.tools.search]
approval_mode = "approve"

[mcp_servers.eslint]
command = "npx"
args = ["-y", "@eslint/mcp@latest"]

[mcp_servers.git]
command = "uvx"
args = ["mcp-server-git", "--repository", "/Users/sash/Dev/Projects/earnit-kids"]

[mcp_servers.git.tools.git_diff_unstaged]
approval_mode = "approve"

[mcp_servers.git.tools.git_status]
approval_mode = "approve"

[mcp_servers.git.tools.git_diff]
approval_mode = "approve"
