<!-- Секция истории -->
<section class="section hidden" id="history-section">
    <h2>История операций</h2>
    <div class="section__buttons admin-only hidden" style="margin-bottom: 1rem;">
        <button class="btn btn--danger btn--small" id="clear-history-btn">Очистить всё</button>
    </div>

    <!-- Статистика бюджета -->
    <div class="budget-stats" id="budget-stats">
        <div class="stat-card">
            <div class="stat-card__icon">
                <span class="gamified-icon icon-wallet" aria-hidden="true"></span>
            </div>
            <div class="stat-card__content">
                <div class="stat-card__value">
                    <span id="money-spent">0</span> / <span id="money-limit">10,000</span>
                    <span id="money-remaining" style="font-size: 0.8em; font-weight: 400; margin-left: 4px;"></span>
                </div>
                <div class="stat-card__label">Потрачено в этом месяце</div>
            </div>
            <div class="stat-card__progress">
                <div class="progress-bar" id="money-progress"></div>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-card__icon">
                <span class="gamified-icon icon-coin-stack" aria-hidden="true"></span>
            </div>
            <div class="stat-card__content">
                <div class="stat-card__value">
                    <div class="stat-card__value-head">
                        <span class="stat-card__value-number" id="coins-earned-today">0</span>
                        <span class="stat-card__value-unit gamified-icon icon-coin-stack" aria-hidden="true"></span>
                    </div>
                    <div class="stat-card__value-note" id="coins-daily-limit">Лимит: ∞</div>
                </div>
                <div class="stat-card__label">Заработано сегодня</div>
                <div class="stat-card__progress stat-card__progress--coins">
                    <div class="progress-bar" id="coins-daily-progress"></div>
                </div>
                <div class="stat-card__meta" id="coins-daily-remaining"></div>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-card__icon" id="large-icon">
                <span class="gamified-icon icon-empty" aria-hidden="true"></span>
            </div>
            <div class="stat-card__content">
                <div class="stat-card__value" id="large-purchase">Нет</div>
                <div class="stat-card__label">Крупная покупка месяца</div>
            </div>
        </div>
    </div>

    <div class="history-list" id="history-list">
        <!-- Записи истории -->
    </div>
    <div class="empty-state hidden" id="history-empty">
        <span class="empty-state__icon">
            <span class="gamified-icon icon-empty" aria-hidden="true"></span>
        </span>
        <p class="empty-state__title">История пока пуста</p>
        <p class="empty-state__hint">Выполните или подтвердите первое действие — и запись появится тут.</p>
        <div class="empty-state__actions">
            <span class="empty-state__tip">Нажмите на задачу в списке, чтобы попасть в первую запись.</span>
        </div>
    </div>
</section>
