<section id="catalog-section" class="section hidden">
    <div class="container">
        <h2 class="section-title">Общий Каталог</h2>
        <p class="section-subtitle">Выберите задания и товары для вашего магазина</p>

        <div class="filter-card">
            <div class="filter-group">
                <label>Возраст: от <span id="age-min-val">7</span> до <span id="age-max-val">18</span> лет</label>
                <div class="slider-container dual-slider" style="position: relative; height: 30px; margin-top: 10px;">
                    <input type="range" id="catalog-age-min-filter" value="7" min="7" max="18" class="age-slider"
                        style="position: absolute; pointer-events: none; z-index: 2; width: 100%; -webkit-appearance: none; appearance: none; background: transparent;">
                    <input type="range" id="catalog-age-max-filter" value="18" min="7" max="18" class="age-slider"
                        style="position: absolute; pointer-events: none; z-index: 1; width: 100%; -webkit-appearance: none; appearance: none; background: transparent;">
                    <div class="slider-track"
                        style="position: absolute; top: 13px; height: 6px; background: rgba(255,255,255,0.1); width: 100%; border-radius: 3px;">
                    </div>
                    <div id="slider-range-highlight"
                        style="position: absolute; top: 13px; height: 6px; background: var(--color-primary); border-radius: 3px; z-index: 0;">
                    </div>
                </div>
            </div>
            <p class="hint">Показываем задания для этого возраста</p>
        </div>

        <div class="catalog-grid">
            <div class="catalog-column">
                <h3>Задания</h3>
                <div class="group-nav hidden" id="catalog-tasks-group-nav"></div>
                <div id="catalog-tasks-list" class="items-list"></div>
            </div>
            <div class="catalog-column">
                <h3>Товары</h3>
                <div class="group-nav hidden" id="catalog-products-group-nav"></div>
                <div id="catalog-products-list" class="items-list"></div>
            </div>
        </div>
    </div>
</section>
