version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - .env
    environment:
      PORT: 3000
      BACKEND_URL: http://host.docker.internal:8080
      PUBLIC_BASE_URL: http://localhost:5001
    ports:
      - "5001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - local

networks:
  local:
    driver: bridge
