name: Publication security

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  secret-history:
    name: Scan all reachable history
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Scan every reachable commit
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            "zricethezav/gitleaks:v${GITLEAKS_VERSION}" \
            git --log-opts="--all" --redact \
              --config /repo/.gitleaks.toml \
              --report-format sarif \
              --report-path /repo/gitleaks-history.sarif

      - name: Upload private scan report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gitleaks-history-report
          path: gitleaks-history.sarif
          if-no-files-found: ignore
          retention-days: 7
