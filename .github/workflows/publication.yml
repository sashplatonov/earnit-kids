name: Publication security

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-filesystem:
    name: Scan shipped repository configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Scan repository filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-release-report.json
          scanners: vuln,secret,misconfig
          ignore-unfixed: true
          exit-code: '1'
          severity: HIGH,CRITICAL
          skip-dirs: .git,.mvn,target,node_modules,build,dist,.svelte-kit,coverage,test-results,.vite
          cache-dir: ${{ runner.temp }}/.trivy-cache

      - name: Upload private release scan report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: trivy-release-report
          path: trivy-release-report.json
          if-no-files-found: ignore
          retention-days: 7

  secret-history:
    name: Scan all reachable history
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Scan every reachable commit
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            "zricethezav/gitleaks:v${GITLEAKS_VERSION}" \
            git --log-opts="--all" --redact \
              --config /repo/.gitleaks.toml \
              --report-format sarif \
              --report-path /repo/gitleaks-history.sarif

      - name: Upload private scan report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gitleaks-history-report
          path: gitleaks-history.sarif
          if-no-files-found: ignore
          retention-days: 7
