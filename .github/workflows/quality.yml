name: Quality

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: apps/backend/pom.xml

      - name: Verify
        run: ./mvnw -B -ntp verify

      - name: Telegram cross-channel contract
        run: ./mvnw -B -ntp -Dtest=TelegramCrossChannelIntegrationTest test

      - name: Localization catalog contracts
        run: ./mvnw -B -ntp -Dtest=TelegramCatalogContractTest,TelegramMessageResolverTest,BackendMessagesTest test

      - name: Backend test summary
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports_dir = Path("target/surefire-reports")
          report_files = sorted(reports_dir.glob("TEST-*.xml"))

          summary_path = Path(__import__("os").environ["GITHUB_STEP_SUMMARY"])
          lines = ["## Backend Test Report", "Summary", ""]

          if not report_files:
            lines.append("⚪ No Surefire XML reports found.")
            summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
            raise SystemExit(0)

          test_files = len(report_files)
          tests = failures = errors = skipped = 0

          for report_file in report_files:
            suite = ET.parse(report_file).getroot()
            tests += int(suite.attrib.get("tests", 0))
            failures += int(suite.attrib.get("failures", 0))
            errors += int(suite.attrib.get("errors", 0))
            skipped += int(suite.attrib.get("skipped", 0))

          passed = tests - failures - errors - skipped
          file_status = "✅" if failures == 0 and errors == 0 else "❌"
          test_status = "✅" if failures == 0 and errors == 0 else "❌"
          failure_status = "✅" if failures == 0 else "❌"
          error_status = "✅" if errors == 0 else "❌"
          skipped_status = "✅" if skipped == 0 else "⚠️"

          lines.extend(
            [
              f"- **Test Files**: {file_status} **{test_files} suites**",
              f"- **Test Results**: {test_status} **{passed} passed** · {tests} total",
              f"- **Failures**: {failure_status} **{failures}**",
              f"- **Errors**: {error_status} **{errors}**",
              f"- **Skipped**: {skipped_status} **{skipped}**",
            ]
          )

          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload SpotBugs reports
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: spotbugs-reports
          path: |
            apps/backend/target/spotbugs
            apps/backend/target/spotbugs.xml
            apps/backend/target/spotbugsXml.xml
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 9

  verify-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Telegram Mini App tests
        run: npm run test -- --run

      - name: Localization catalog contracts
        run: npm run test -- --run tests/unit/i18n/catalog.test.ts

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  verify-web-e2e:
    name: Web critical browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run critical browser flows
        env:
          CI: true
          PLAYWRIGHT_USE_PREVIEW: true
        run: npm run test:e2e:critical

      - name: Localization browser flows
        env:
          CI: true
          PLAYWRIGHT_USE_PREVIEW: true
        run: npm run test:e2e -- tests/e2e/public-i18n.spec.ts tests/e2e/telegram-consistency.spec.ts

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: web-e2e-failure-artifacts
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 9

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Validate security scan policy
        run: |
          set -euo pipefail
          test -f .gitleaks.toml
          grep -Fq "GITLEAKS_VERSION: 8.30.1" .github/workflows/quality.yml
          grep -Fq "GITLEAKS_VERSION: 8.30.1" .github/workflows/publication.yml
          grep -Fq "severity: HIGH,CRITICAL" .github/workflows/quality.yml
          grep -Fq "scanners: vuln,secret,misconfig" .github/workflows/quality.yml

      - name: Run repository security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-repository-report.json
          scanners: vuln,secret,misconfig
          ignore-unfixed: true
          exit-code: '1'
          severity: HIGH,CRITICAL
          skip-dirs: .git,.mvn,target,node_modules,build,dist,.svelte-kit,coverage,test-results,.vite
          cache-dir: ${{ runner.temp }}/.trivy-cache

      - name: Upload Trivy reports
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: trivy-security-reports
          path: |
            trivy-repository-report.json
            trivy-backend-report.json
            trivy-frontend-report.json
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

      - name: Run backend security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: apps/backend
          format: json
          output: trivy-backend-report.json
          scanners: vuln,secret,misconfig
          exit-code: '1'
          severity: HIGH,CRITICAL
          skip-dirs: target,.mvn
          skip-files: hibernate-validator-9.1.0.Final-sources.jar
          cache-dir: ${{ runner.temp }}/.trivy-cache

      - name: Backend security summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          report_path = Path("trivy-backend-report.json")
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          lines = ["## Backend Security Report", "Summary", ""]

          if not report_path.exists():
            lines.append("⚪ No Trivy JSON report found.")
            summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
            raise SystemExit(0)

          report = json.loads(report_path.read_text(encoding="utf-8"))
          vuln = Counter()
          misconfig = Counter()
          secrets = Counter()
          targets = []

          for result in report.get("Results", []):
            target = result.get("Target", "unknown")
            targets.append(target)
            for item in result.get("Vulnerabilities", []) or []:
              vuln[item.get("Severity", "UNKNOWN")] += 1
            for item in result.get("Misconfigurations", []) or []:
              misconfig[item.get("Severity", "UNKNOWN")] += 1
            for item in result.get("Secrets", []) or []:
              secrets[item.get("Severity", "UNKNOWN")] += 1

          total_vuln = sum(vuln.values())
          total_misconfig = sum(misconfig.values())
          total_secrets = sum(secrets.values())
          clean = total_vuln == 0 and total_misconfig == 0 and total_secrets == 0
          overall = "✅ Clean" if clean else "❌ Findings detected"
          vuln_status = "✅" if total_vuln == 0 else "❌"
          misconfig_status = "✅" if total_misconfig == 0 else "❌"
          secret_status = "✅" if total_secrets == 0 else "❌"

          lines.extend(
            [
              f"- **Overall**: {overall}",
              f"- **Targets**: 📦 **{len(targets)}**",
              f"- **Vulnerabilities**: {vuln_status} **{total_vuln}**",
              f"- **Misconfigurations**: {misconfig_status} **{total_misconfig}**",
              f"- **Secrets**: {secret_status} **{total_secrets}**",
            ]
          )

          if total_vuln:
            lines.append(f"- **Vulnerability severities**: 🔶 HIGH {vuln.get('HIGH', 0)} · 🔴 CRITICAL {vuln.get('CRITICAL', 0)}")
          if total_misconfig:
            lines.append(f"- **Misconfiguration severities**: 🔶 HIGH {misconfig.get('HIGH', 0)} · 🔴 CRITICAL {misconfig.get('CRITICAL', 0)}")
          if total_secrets:
            lines.append(f"- **Secret severities**: 🔶 HIGH {secrets.get('HIGH', 0)} · 🔴 CRITICAL {secrets.get('CRITICAL', 0)}")

          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Run frontend security scan
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: apps/web
          format: json
          output: trivy-frontend-report.json
          scanners: vuln,secret,misconfig
          ignore-unfixed: true
          exit-code: '1'
          severity: HIGH,CRITICAL
          skip-dirs: node_modules,build,dist,.svelte-kit,coverage,test-results,.vite
          cache-dir: ${{ runner.temp }}/.trivy-cache

      - name: Frontend security summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          report_path = Path("trivy-frontend-report.json")
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          lines = ["## Frontend Security Report", "Summary", ""]

          if not report_path.exists():
            lines.append("⚪ No Trivy JSON report found.")
            summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
            raise SystemExit(0)

          report = json.loads(report_path.read_text(encoding="utf-8"))
          vuln = Counter()
          misconfig = Counter()
          secrets = Counter()
          targets = []

          for result in report.get("Results", []):
            target = result.get("Target", "unknown")
            targets.append(target)
            for item in result.get("Vulnerabilities", []) or []:
              vuln[item.get("Severity", "UNKNOWN")] += 1
            for item in result.get("Misconfigurations", []) or []:
              misconfig[item.get("Severity", "UNKNOWN")] += 1
            for item in result.get("Secrets", []) or []:
              secrets[item.get("Severity", "UNKNOWN")] += 1

          total_vuln = sum(vuln.values())
          total_misconfig = sum(misconfig.values())
          total_secrets = sum(secrets.values())
          clean = total_vuln == 0 and total_misconfig == 0 and total_secrets == 0
          overall = "✅ Clean" if clean else "❌ Findings detected"
          vuln_status = "✅" if total_vuln == 0 else "❌"
          misconfig_status = "✅" if total_misconfig == 0 else "❌"
          secret_status = "✅" if total_secrets == 0 else "❌"

          lines.extend(
            [
              f"- **Overall**: {overall}",
              f"- **Targets**: 📦 **{len(targets)}**",
              f"- **Vulnerabilities**: {vuln_status} **{total_vuln}**",
              f"- **Misconfigurations**: {misconfig_status} **{total_misconfig}**",
              f"- **Secrets**: {secret_status} **{total_secrets}**",
            ]
          )

          if total_vuln:
            lines.append(f"- **Vulnerability severities**: 🔶 HIGH {vuln.get('HIGH', 0)} · 🔴 CRITICAL {vuln.get('CRITICAL', 0)}")
          if total_misconfig:
            lines.append(f"- **Misconfiguration severities**: 🔶 HIGH {misconfig.get('HIGH', 0)} · 🔴 CRITICAL {misconfig.get('CRITICAL', 0)}")
          if total_secrets:
            lines.append(f"- **Secret severities**: 🔶 HIGH {secrets.get('HIGH', 0)} · 🔴 CRITICAL {secrets.get('CRITICAL', 0)}")

          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

  secret-scan-root:
    name: Root repository secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Scan repository root
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            "zricethezav/gitleaks:v${GITLEAKS_VERSION}" \
            dir /repo --redact \
              --config /repo/.gitleaks.toml \
              --report-format sarif \
              --report-path /repo/gitleaks-root.sarif

      - name: Upload private scan report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gitleaks-root-report
          path: gitleaks-root.sarif
          if-no-files-found: ignore
          retention-days: 3

  secret-scan-fast:
    name: Fast changed-commit secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Scan changed commits
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            log_opts="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          else
            log_opts="${{ github.event.before }}..${{ github.sha }}"
          fi
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            "zricethezav/gitleaks:v${GITLEAKS_VERSION}" \
            git --log-opts="$log_opts" --redact \
              --config /repo/.gitleaks.toml \
              --report-format sarif \
              --report-path /repo/gitleaks-fast.sarif

      - name: Upload private scan report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gitleaks-fast-report
          path: gitleaks-fast.sarif
          if-no-files-found: ignore
          retention-days: 3

  secret-scan-regression:
    name: Secret-scan rule regression
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Prove private-key rule catches a fixture
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          fixture_dir="$(mktemp -d)"
          # A non-secret placeholder proves the path rule fires without a real key.
          printf 'fixture-only: not a real signing key\n' > "$fixture_dir/fixture.keystore"
          cp .gitleaks.toml "$fixture_dir/.gitleaks.toml"
          if docker run --rm \
            -v "$fixture_dir:/repo" \
            "zricethezav/gitleaks:v${GITLEAKS_VERSION}" \
            dir /repo --redact --config /repo/.gitleaks.toml \
            >/dev/null 2>&1; then
            echo "::error::gitleaks did not flag the .keystore fixture; private-key rule is not enforced."
            exit 1
          fi
          echo "gitleaks correctly rejected the .keystore fixture."
          rm -rf "$fixture_dir"
