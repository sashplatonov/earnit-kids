services:
  web:
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_NEW_RELIC_BROWSER_ENABLED: ${VITE_NEW_RELIC_BROWSER_ENABLED:-false}
        VITE_NEW_RELIC_BROWSER_INFO: ${VITE_NEW_RELIC_BROWSER_INFO:-}
        VITE_NEW_RELIC_BROWSER_INIT: ${VITE_NEW_RELIC_BROWSER_INIT:-}
        VITE_NEW_RELIC_BROWSER_LOADER_CONFIG: ${VITE_NEW_RELIC_BROWSER_LOADER_CONFIG:-}
    env_file:
      - .env
    environment:
      # Web edge
      PORT: ${WEB_INTERNAL_PORT}
      BACKEND_URL: http://backend:${BACKEND_INTERNAL_PORT}
      APP_URL: ${APP_URL}
      FRONTEND_URL: ${APP_URL}
      PUBLIC_BASE_URL: ${APP_URL}
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${WEB_PORT}:${WEB_INTERNAL_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:${WEB_INTERNAL_PORT}/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - edge

  backend:
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        JAVA_XMX: ${JAVA_XMX}
    env_file:
      - .env
    environment:
      # Backend
      QUARKUS_HTTP_PORT: ${BACKEND_INTERNAL_PORT}
      FRONTEND_URL: ${APP_URL}
      APP_URL: ${APP_URL:-http://localhost:5001}
      GOOGLE_AUTH_REDIRECT_URI: ${GOOGLE_AUTH_REDIRECT_URI:-http://localhost:5001/api/login-google/callback}
      JWT_SECRET: ${JWT_SECRET}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEW_RELIC_METRICS_ENABLED: ${NEW_RELIC_METRICS_ENABLED:-false}
      NEW_RELIC_OTLP_METRICS_ENDPOINT: ${NEW_RELIC_OTLP_METRICS_ENDPOINT:-https://otlp.nr-data.net}
      NEW_RELIC_OTLP_METRICS_PROTOCOL: ${NEW_RELIC_OTLP_METRICS_PROTOCOL:-http/protobuf}
      DATABASE_URL: jdbc:postgresql://${DB_HOST}:${DB_INTERNAL_PORT}/${DB_NAME}
      DATA_DIR: /work/data/catalog
    volumes:
      - earnit_kids_base_data:/work/data/catalog
    expose:
      - "${BACKEND_INTERNAL_PORT}"
    restart: unless-stopped
    networks:
      - backend
      - edge
      - dokploy-ipv6

  db:
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /var/run/postgresql
    profiles:
      - db
    image: postgres:18-alpine
    environment:
      # Database
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - earnit_kids_postgres_data:/var/lib/postgresql
    ports:
      - "${DB_HOST_PORT}:${DB_INTERNAL_PORT}"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

volumes:
  earnit_kids_postgres_data:
  earnit_kids_base_data:

networks:
  backend:
    driver: bridge
  edge:
    driver: bridge
  # ⚠️ DO NOT REMOVE: dokploy-ipv6 — Dokploy external network for IPv6 routing.
  # Required for Dokploy reverse-proxy to reach the backend.
  dokploy-ipv6:
    external: true
