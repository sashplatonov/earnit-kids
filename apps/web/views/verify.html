<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Подтверждение Email - EarnIt Kids</title>
    <meta name="description" content="Подтверждение email для входа в EarnIt Kids.">
    <link rel="canonical" href="{{CANONICAL_URL}}">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#fff3e0">
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Open+Sans:wght@400;600&display=swap"
        rel="stylesheet">
    {{CLARITY_SCRIPT}}
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            background:
                radial-gradient(620px 360px at 10% 0%, rgba(92, 199, 243, 0.18), transparent 58%),
                radial-gradient(560px 320px at 100% 0%, rgba(255, 214, 107, 0.24), transparent 52%),
                linear-gradient(180deg, #fffdf8 0%, #f5fbff 52%, #fff4e8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 1rem;
        }

        .verify-card {
            background: rgba(255, 255, 255, 0.94);
            padding: 2rem;
            border-radius: 1.5rem;
            border: 1px solid rgba(125, 149, 187, 0.16);
            box-shadow: 0 24px 48px rgba(110, 136, 184, 0.14);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .logo {
            font-family: 'Fredoka One', cursive;
            font-size: 2rem;
            color: #ffb65c;
            text-shadow: 2px 2px #ffd86f;
            margin-bottom: 2rem;
        }

        #message {
            margin-top: 1rem;
            padding: 10px;
            border-radius: 5px;
            font-size: 1.1rem;
        }

        .loading {
            color: #2196F3;
        }

        .error {
            background: #ffebee;
            color: #c62828;
        }

        .success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .btn-primary {
            display: inline-block;
            background: linear-gradient(135deg, #ffb65c, #ff8f70);
            color: white;
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 2rem;
            font-size: 1.1rem;
            cursor: pointer;
            text-decoration: none;
            margin-top: 20px;
            transition: transform 0.1s;
            box-shadow: 0 16px 28px rgba(255, 143, 112, 0.24);
        }
    </style>
</head>

<body>
    <div class="verify-card">
        <div class="logo">🪙 Coins Shop</div>
        <h2>Подтверждение Email</h2>
        <div id="message" class="loading">Проверка ссылки...</div>
        <a href="/login.html" id="loginBtn" class="btn-primary" style="display: none;">Войти</a>
    </div>

    <script src="/js/client-error-reporter.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const email = urlParams.get('email');
        const messageDiv = document.getElementById('message');
        const loginBtn = document.getElementById('loginBtn');

        if (!token || !email) {
            messageDiv.textContent = 'Неверная ссылка подтверждения.';
            messageDiv.className = 'error';
        } else {
            verifyEmail();
        }

        async function verifyEmail() {
            try {
                const response = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, email })
                });

                const data = await response.json();

                if (data.success) {
                    messageDiv.textContent = 'Email успешно подтвержден!';
                    messageDiv.className = 'success';
                    loginBtn.style.display = 'inline-block';
                } else {
                    messageDiv.textContent = data.error || 'Ошибка подтверждения';
                    messageDiv.className = 'error';
                }
            } catch (err) {
                messageDiv.textContent = 'Ошибка сервера';
                messageDiv.className = 'error';
            }
        }
    </script>
</body>

</html>
