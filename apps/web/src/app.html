<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <script src="https://telegram.org/js/telegram-web-app.js"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
        <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap&subset=cyrillic,cyrillic-ext,latin" rel="stylesheet" />
        <link rel="stylesheet" href="/css/style.css?v=20260502-child-switcher-fix" />
        <link rel="stylesheet" href="/css/public-top-nav.css?v=20260502-child-switcher-fix" />
        <style>
            /* Inline override: ensure super-admin header isn't pushed down */
            body.super-admin-page { padding-top: 0 !important; }
            body.super-admin-page .super-admin-shell { padding-top: 0.35rem !important; }
            body:has(#app) { padding-top: 0 !important; }
        </style>
        <link rel="shortcut icon" href="/img/favicon.ico" type="image/x-icon" />
        <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png" />
        <link rel="apple-touch-icon" href="/img/icon-192.png" />
        <meta name="theme-color" content="#fff3e0" />
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <script>if (typeof window !== 'undefined' && location && location.pathname) { try { const normalized = location.pathname.replace(/^\/(en|ru)(?=\/|$)/, ''); if (normalized.startsWith('/super-admin')) { document.body.classList.add('super-admin-page'); } } catch (error) {} }</script>
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
