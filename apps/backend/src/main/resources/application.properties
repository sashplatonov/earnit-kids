quarkus.http.host=0.0.0.0
quarkus.http.port=${QUARKUS_HTTP_PORT:8080}
quarkus.application.name=earnit-kids-backend
quarkus.native.additional-build-args=--enable-preview
# Compression is handled by the Node.js edge service (web). The backend is
# only reachable internally (same Docker network) so compressing here causes
# double-gzip when the edge middleware re-compresses the already-gzipped body.
quarkus.http.enable-compression=false
quarkus.http.proxy.proxy-address-forwarding=true
app.security.rate-limit.enabled=${PUBLIC_AUTH_RATE_LIMIT_ENABLED:true}
app.security.rate-limit.child.max-requests=${PUBLIC_AUTH_RATE_LIMIT_CHILD_MAX_REQUESTS:5}
app.security.rate-limit.child.window-seconds=${PUBLIC_AUTH_RATE_LIMIT_CHILD_WINDOW_SECONDS:60}
app.security.rate-limit.parent.max-requests=${PUBLIC_AUTH_RATE_LIMIT_PARENT_MAX_REQUESTS:5}
app.security.rate-limit.parent.window-seconds=${PUBLIC_AUTH_RATE_LIMIT_PARENT_WINDOW_SECONDS:60}
app.security.rate-limit.oauth-start.max-requests=${PUBLIC_AUTH_RATE_LIMIT_OAUTH_START_MAX_REQUESTS:10}
app.security.rate-limit.oauth-start.window-seconds=${PUBLIC_AUTH_RATE_LIMIT_OAUTH_START_WINDOW_SECONDS:60}
app.security.rate-limit.oauth-callback.max-requests=${PUBLIC_AUTH_RATE_LIMIT_OAUTH_CALLBACK_MAX_REQUESTS:5}
app.security.rate-limit.oauth-callback.window-seconds=${PUBLIC_AUTH_RATE_LIMIT_OAUTH_CALLBACK_WINDOW_SECONDS:60}
app.security.rate-limit.telegram.max-requests=${PUBLIC_AUTH_RATE_LIMIT_TELEGRAM_MAX_REQUESTS:10}
app.security.rate-limit.telegram.window-seconds=${PUBLIC_AUTH_RATE_LIMIT_TELEGRAM_WINDOW_SECONDS:60}
quarkus.default-locale=en
quarkus.locales=en,ru

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:${FRONTEND_URL:http://localhost:3000}}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=Accept,Authorization,Content-Type,Cookie,X-CSRF-Token,X-Requested-With,X-Forwarded-For,X-Forwarded-Host,X-Forwarded-Proto
quarkus.http.cors.access-control-allow-credentials=true

quarkus.log.level=INFO
quarkus.log.category."com.sashplatonov.earnit.kids".level=INFO
quarkus.log.category."io.quarkus".level=WARN
quarkus.log.category."org.hibernate".level=WARN
quarkus.log.category."io.netty".level=WARN
quarkus.log.category."io.vertx".level=WARN
quarkus.log.console.json.enabled=true
quarkus.log.console.json.log-format=ecs
quarkus.log.console.json.exception-output-type=formatted
quarkus.log.console.json.additional-field."service.name".value=${quarkus.application.name}
quarkus.log.console.json.additional-field."deployment.environment".value=${DEPLOYMENT_ENV:development}

quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.http-server.enabled=true
app.performance.http-metrics.payload-estimation-enabled=${HTTP_METRICS_PAYLOAD_ESTIMATION_ENABLED:true}
app.performance.http-metrics.payload-estimation-max-collection-size=${HTTP_METRICS_PAYLOAD_ESTIMATION_MAX_COLLECTION_SIZE:256}
app.performance.http-metrics.slow-request-threshold-ms=${HTTP_METRICS_SLOW_REQUEST_THRESHOLD_MS:750}
app.performance.http-metrics.slow-query-threshold-ms=${HTTP_METRICS_SLOW_QUERY_THRESHOLD_MS:250}
app.performance.cache.base-data-ttl=${BASE_DATA_CACHE_TTL:PT5M}
app.performance.cache.system-overview-ttl=${SYSTEM_OVERVIEW_CACHE_TTL:PT30S}
app.performance.cache.family-db-id-ttl=${FAMILY_DB_ID_CACHE_TTL:PT10M}
app.performance.cache.analytics-ttl=${ANALYTICS_CACHE_TTL:PT60S}
app.performance.cache.admin-dashboard-ttl=${ADMIN_DASHBOARD_CACHE_TTL:PT2M}
app.performance.cache.family-dashboard-catalog-ttl=${FAMILY_DASHBOARD_CATALOG_CACHE_TTL:PT5S}

quarkus.cache.caffeine."base-data".expire-after-write=${app.performance.cache.base-data-ttl}
quarkus.cache.caffeine."base-data".metrics-enabled=true
quarkus.cache.caffeine."system-overview".expire-after-write=${app.performance.cache.system-overview-ttl}
quarkus.cache.caffeine."system-overview".metrics-enabled=true
quarkus.cache.caffeine."family-db-id".expire-after-write=${app.performance.cache.family-db-id-ttl}
quarkus.cache.caffeine."family-db-id".maximum-size=10000
quarkus.cache.caffeine."family-db-id".metrics-enabled=true
quarkus.cache.caffeine."admin-dashboard".expire-after-write=${app.performance.cache.admin-dashboard-ttl}
quarkus.cache.caffeine."admin-dashboard".metrics-enabled=true
quarkus.cache.caffeine."admin-trends".expire-after-write=${app.performance.cache.admin-dashboard-ttl}
quarkus.cache.caffeine."admin-trends".metrics-enabled=true
quarkus.cache.caffeine."admin-analytics-overview".expire-after-write=${app.performance.cache.admin-dashboard-ttl}
quarkus.cache.caffeine."admin-analytics-overview".metrics-enabled=true
quarkus.cache.caffeine."admin-coin-economy".expire-after-write=${app.performance.cache.admin-dashboard-ttl}
quarkus.cache.caffeine."admin-coin-economy".metrics-enabled=true
quarkus.cache.caffeine."admin-task-economy".expire-after-write=${app.performance.cache.admin-dashboard-ttl}
quarkus.cache.caffeine."admin-task-economy".metrics-enabled=true
quarkus.cache.caffeine."admin-parent-behavior".expire-after-write=${app.performance.cache.admin-dashboard-ttl}
quarkus.cache.caffeine."admin-parent-behavior".metrics-enabled=true
quarkus.cache.caffeine."admin-child-behavior".expire-after-write=${app.performance.cache.admin-dashboard-ttl}
quarkus.cache.caffeine."admin-child-behavior".metrics-enabled=true
quarkus.cache.caffeine."admin-activation-funnel".expire-after-write=${app.performance.cache.admin-dashboard-ttl}
quarkus.cache.caffeine."admin-activation-funnel".metrics-enabled=true
quarkus.cache.caffeine."admin-retention".expire-after-write=${app.performance.cache.admin-dashboard-ttl}
quarkus.cache.caffeine."admin-retention".metrics-enabled=true
quarkus.cache.caffeine."admin-rewards".expire-after-write=${app.performance.cache.admin-dashboard-ttl}
quarkus.cache.caffeine."admin-rewards".metrics-enabled=true
quarkus.cache.caffeine."family-dashboard-catalog".expire-after-write=${app.performance.cache.family-dashboard-catalog-ttl}
quarkus.cache.caffeine."family-dashboard-catalog".maximum-size=10000
quarkus.cache.caffeine."family-dashboard-catalog".metrics-enabled=true

app.observability.new-relic.agent-enabled=${NEW_RELIC_AGENT_ENABLED:false}
app.observability.new-relic.metrics.enabled=${NEW_RELIC_METRICS_ENABLED:false}
app.observability.new-relic.metrics.otlp-metrics-endpoint=${NEW_RELIC_OTLP_METRICS_ENDPOINT:https://otlp.nr-data.net}
app.observability.new-relic.metrics.otlp-metrics-protocol=${NEW_RELIC_OTLP_METRICS_PROTOCOL:http/protobuf}
app.observability.new-relic.metrics.license-key=${NEW_RELIC_LICENSE_KEY:}
app.observability.new-relic.logging.forwarding-enabled=${NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED:false}
app.observability.new-relic.logging.forwarding-max-samples-stored=${NEW_RELIC_APPLICATION_LOGGING_FORWARDING_MAX_SAMPLES_STORED:10000}
app.observability.new-relic.logging.local-decorating-enabled=${NEW_RELIC_APPLICATION_LOGGING_LOCAL_DECORATING_ENABLED:false}

quarkus.otel.metrics.enabled=${app.observability.new-relic.metrics.enabled:false}
quarkus.otel.exporter.otlp.metrics.endpoint=${app.observability.new-relic.metrics.otlp-metrics-endpoint:https://otlp.nr-data.net}
quarkus.otel.exporter.otlp.metrics.protocol=${app.observability.new-relic.metrics.otlp-metrics-protocol:http/protobuf}
quarkus.otel.exporter.otlp.metrics.headers=api-key=${app.observability.new-relic.metrics.license-key:}
# The New Relic Java agent owns APM traces and application logs. Keep the
# Quarkus OTLP pipeline metrics-only so it never falls back to localhost:4317.
quarkus.otel.traces.exporter=none
quarkus.otel.logs.exporter=none
quarkus.otel.logs.handler.enabled=false

%dev.quarkus.log.level=INFO
%dev.quarkus.log.category."com.sashplatonov.earnit.kids".level=DEBUG
%dev.quarkus.log.console.json.enabled=false

%test.quarkus.log.level=ERROR
%test.quarkus.log.category."com.sashplatonov.earnit.kids".level=WARN
%test.quarkus.log.console.json.enabled=false
%test.app.telegram.outbox-enabled=false
%test.app.telegram.retention-enabled=false
%test.app.parent-invitation.active-key=test-only-parent-invitation-key
%test.app.security.rate-limit.enabled=false

compat.jwt.secret=${JWT_SECRET:fallback-secret-for-development}
app.parent-invitation.active-key-id=${PARENT_INVITATION_ACTIVE_KEY_ID:v1}
app.parent-invitation.active-key=${PARENT_INVITATION_ACTIVE_KEY:}
app.parent-invitation.previous-key-id=${PARENT_INVITATION_PREVIOUS_KEY_ID:}
app.parent-invitation.previous-key=${PARENT_INVITATION_PREVIOUS_KEY:}
app.parent-invitation.mail-provider=${PARENT_INVITATION_MAIL_PROVIDER:disabled}
app.parent-invitation.public-origin=${APP_URL:http://localhost:3000}

# ---- Telegram Mini App (closed by default) ----
app.telegram.enabled=${ENABLE_TELEGRAM_MINI_APP:false}
app.telegram.mini-app-enabled=${ENABLE_TELEGRAM_MINI_APP:false}
app.telegram.bot-enabled=${ENABLE_TELEGRAM_BOT:false}
app.telegram.notifications-enabled=${ENABLE_TELEGRAM_NOTIFICATIONS:false}
app.telegram.rollout-family-id=${TELEGRAM_ROLLOUT_FAMILY_ID:}
app.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
app.telegram.bot-username=${TELEGRAM_BOT_USERNAME:}
app.telegram.admin-user-ids=${TELEGRAM_ADMIN_USER_IDS:}
app.telegram.mini-app-url=${TELEGRAM_MINI_APP_URL:${APP_URL}/telegram}
app.telegram.public-site-url=${APP_URL:}
app.telegram.init-data-max-age-seconds=${TELEGRAM_INIT_DATA_MAX_AGE_SECONDS:300}
app.telegram.webhook-secret=${TELEGRAM_WEBHOOK_SECRET:}
app.telegram.callback-signing-secret=${TELEGRAM_CALLBACK_SIGNING_SECRET:}
app.telegram.callback-ttl-seconds=${TELEGRAM_CALLBACK_TTL_SECONDS:300}
app.telegram.callback-menu-version=${TELEGRAM_CALLBACK_MENU_VERSION:1}
app.telegram.reply-keyboard-version=${TELEGRAM_REPLY_KEYBOARD_VERSION:4}
app.telegram.webhook-registration-interval=${TELEGRAM_WEBHOOK_REGISTRATION_INTERVAL:5m}
app.telegram.outbox-enabled=${ENABLE_TELEGRAM_OUTBOX:true}
app.telegram.outbox-poll-interval=${TELEGRAM_OUTBOX_POLL_INTERVAL:10s}
app.telegram.outbox-max-attempts=${TELEGRAM_OUTBOX_MAX_ATTEMPTS:5}
app.telegram.retention-enabled=${ENABLE_TELEGRAM_RETENTION:true}
app.telegram.retention-poll-interval=${TELEGRAM_RETENTION_POLL_INTERVAL:24h}
app.telegram.invite-retention-days=${TELEGRAM_INVITE_RETENTION_DAYS:30}
app.telegram.callback-retention-days=${TELEGRAM_CALLBACK_RETENTION_DAYS:30}
app.telegram.webhook-update-retention-days=${TELEGRAM_WEBHOOK_UPDATE_RETENTION_DAYS:30}
app.telegram.delivery-retention-days=${TELEGRAM_DELIVERY_RETENTION_DAYS:30}
app.telegram.outbox-retention-days=${TELEGRAM_OUTBOX_RETENTION_DAYS:30}
app.telegram.audit-retention-days=${TELEGRAM_AUDIT_RETENTION_DAYS:365}
app.telegram.retention-batch-size=${TELEGRAM_RETENTION_BATCH_SIZE:100}

# ---- Browser Web Push (closed until VAPID material is configured) ----
app.web-push.enabled=${ENABLE_WEB_PUSH:false}
app.web-push.vapid-public-key=${WEB_PUSH_VAPID_PUBLIC_KEY:}
app.web-push.vapid-private-key=${WEB_PUSH_VAPID_PRIVATE_KEY:}
app.web-push.vapid-subject=${WEB_PUSH_VAPID_SUBJECT:mailto:admin@example.invalid}
app.web-push.max-attempts=${WEB_PUSH_MAX_ATTEMPTS:5}

# ---- DataSource (PostgreSQL via Agroal) ----
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/earnit}
quarkus.datasource.username=${DB_USER:earnit}
quarkus.datasource.password=${DB_PASSWORD:earnit}
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.idle-removal-interval=30S
quarkus.datasource.jdbc.acquisition-timeout=5S

# JSONB mappings in Hibernate ORM should not reuse REST (Jackson) serialization settings.
quarkus.hibernate-orm.mapping.format.global=ignore

# ---- Flyway ----
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.schemas=${DB_SCHEMA}
quarkus.flyway.default-schema=${DB_SCHEMA}
quarkus.flyway.ignore-missing-migrations=true

# ---- Hibernate ORM ----
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.database.default-schema=${DB_SCHEMA}

# ---- Application settings ----
app.production=${PRODUCTION:false}
app.auth.session-ttl-seconds=${SESSION_TTL_SECONDS:2592000}
app.auth.refresh-token-ttl-seconds=${REFRESH_TOKEN_TTL_SECONDS:7776000}
app.google.enabled=${ENABLE_GOOGLE_AUTH:false}
app.google.client-id=${GOOGLE_AUTH_CLIENT_ID:}
app.google.client-secret=${GOOGLE_AUTH_CLIENT_SECRET:}
app.google.redirect-uri=${GOOGLE_AUTH_REDIRECT_URI:}
quarkus.config.mapping.validate-unknown=false

# ---- Health check ----
quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-openapi.path=/api/openapi.yaml
