# Test profile — uses H2 in-memory DB for fast tests without PostgreSQL
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=

quarkus.flyway.migrate-at-start=true
quarkus.flyway.clean-at-start=true
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.schemas=EARNIT_KIDS
quarkus.flyway.default-schema=EARNIT_KIDS

quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.database.default-schema=EARNIT_KIDS

# JSONB mappings in Hibernate ORM should not reuse REST (Jackson) serialization settings.
quarkus.hibernate-orm.mapping.format.global=ignore

compat.jwt.secret=test-secret-key-for-unit-tests
app.production=false
app.super-admin.email=admin@test.com
app.email-verification.enabled=false
app.password-recovery.enabled=true
quarkus.http.host-enabled=false
quarkus.log.console.json.enabled=false
