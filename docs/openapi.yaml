openapi: 3.0.0
info:
  title: Coins Kids Shop API
  description: API for managing tasks, rewards, and history for children in Coins Kids Shop.
  version: 1.0.0
servers:
  - url: /api
    description: Base API path

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: app_auth
  
  schemas:
    Success:
      type: object
      properties:
        success:
          type: boolean
    
    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string

paths:
  /login:
    post:
      summary: Login with email
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
      responses:
        200:
          description: Magic link sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        400:
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /data:
    get:
      summary: Get all family data (tasks, kids, balance)
      tags: [Data]
      security:
        - cookieAuth: []
      responses:
        200:
          description: Data retrieved
        401:
          description: Unauthorized
    post:
      summary: Update task or balance
      tags: [Data]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        200:
          description: Updated

  /history:
    get:
      summary: Get paginated history
      tags: [Data]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        200:
          description: History retrieved

  /health:
    get:
      summary: Service health check
      tags: [Monitoring]
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  database:
                    type: string
                  uptime:
                    type: number

  /metrics:
    get:
      summary: Prometheus metrics
      tags: [Monitoring]
      responses:
        200:
          description: Metrics in Prometheus format
          content:
            text/plain:
              schema:
                type: string
