<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{PAGE_TITLE}}</title>
    <meta name="description" content="{{PAGE_DESCRIPTION}}">
    <link rel="canonical" href="{{CANONICAL_URL}}">
    <meta property="og:title" content="{{PAGE_TITLE}}">
    <meta property="og:description" content="{{PAGE_DESCRIPTION}}">
    <meta property="og:image" content="{{OG_IMAGE_URL}}">
    <meta property="og:url" content="{{CANONICAL_URL}}">
    <script type="application/ld+json">
{{SCHEMA_JSON}}
    </script>
    <link rel="stylesheet" href="css/style.css?v={{BUILD_VERSION}}">
    <link rel="stylesheet" href="/css/public-top-nav.css?v={{BUILD_VERSION}}">
    <link rel="stylesheet" href="/css/public-pages.css?v={{BUILD_VERSION}}">
    {{CLARITY_SCRIPT}}
</head>
<body>
    <div class="public-shell">
        {{PUBLIC_TOP_NAV}}
        <main class="public-inner">
            <article class="article-shell">
                <div class="article-image-wrap">
                    <img class="article-image" src="/img/blog-reading.svg" alt="Иллюстрация к статье блога" loading="lazy">
                </div>
                <header class="article-header">
                    <h1>{{ARTICLE_TITLE}}</h1>
                    <p class="meta">{{ARTICLE_DATE}}</p>
                </header>
                <div class="article-body">
                    {{ARTICLE_BODY}}
                </div>
                <div class="feature-layout__actions">
                    <a class="btn btn--primary" href="/login.html">Попробовать в своей семье</a>
                </div>
            </article>
        </main>
    </div>
</body>
</html>
