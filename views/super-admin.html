<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin - Управление Магазинами</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22%23ffd700%22 /><text x=%2250%22 y=%2265%22 font-family=%22sans-serif%22 font-size=%2250%22 text-anchor=%22middle%22 fill=%22black%22>C</text></svg>">
    <style>
        .super-admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            font-family: 'Nunito', sans-serif;
        }

        .super-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #ffd700;
        }

        .super-header h1 {
            font-size: 2.5rem;
            color: #ffd700;
            margin: 0;
        }

        .logout-btn {
            padding: 0.75rem 1.5rem;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: #ff3838;
            transform: translateY(-2px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 1.5rem;
            border-radius: 1rem;
            color: white;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .stat-card h3 {
            font-size: 0.9rem;
            opacity: 0.9;
            margin: 0 0 0.5rem 0;
        }

        .stat-card .value {
            font-size: 2.5rem;
            font-weight: 800;
        }

        .families-table {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .families-table h2 {
            padding: 1.5rem;
            margin: 0;
            background: linear-gradient(135deg, #ffd700 0%, #ffae00 100%);
            color: #1a1a2e;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f8f9fa;
        }

        th {
            padding: 1rem;
            text-align: left;
            font-weight: 700;
            color: #495057;
            border-bottom: 2px solid #dee2e6;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid #dee2e6;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .view-btn,
        .block-btn {
            padding: 0.5rem 1rem;
            color: white;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-right: 5px;
        }

        .view-btn {
            background: #4CAF50;
        }

        .view-btn:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        .block-btn {
            background: #ff4757;
        }

        .block-btn.unblock {
            background: #2ecc71;
        }

        .block-btn:hover {
            transform: translateY(-2px);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 2rem;
            cursor: pointer;
            color: #999;
        }

        .modal-close:hover {
            color: #333;
        }

        .family-detail {
            margin-top: 1.5rem;
        }

        .family-detail h3 {
            color: #ffd700;
            border-bottom: 2px solid #ffd700;
            padding-bottom: 0.5rem;
            margin-top: 1.5rem;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin: 1rem 0;
        }

        .detail-item {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 0.5rem;
        }

        .detail-item strong {
            display: block;
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 0.25rem;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #999;
        }

        /* Fix text visibility on white backgrounds */
        .families-table,
        .item-card,
        .modal-content,
        input,
        select,
        textarea {
            color: #1a1a2e;
        }
    </style>
</head>

<body>
    <div class="super-admin-container">
        <div class="super-header">
            <h1>🔐 Super Admin Panel</h1>
            <button id="logout-btn" class="logout-btn">Выйти</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="families">Магазины</button>
            <button class="tab-btn" data-tab="catalog">Базовый Каталог</button>
        </div>

        <!-- Families Tab -->
        <div id="tab-families" class="tab-content active">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Всего Магазинов</h3>
                    <div class="value" id="total-families">-</div>
                </div>
                <div class="stat-card" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                    <h3>Последний Созданный</h3>
                    <div class="value" style="font-size: 1.2rem;" id="latest-family">-</div>
                </div>
            </div>

            <div class="families-table">
                <h2>📊 Все Магазины Монет</h2>
                <div id="loading" class="loading">Загрузка...</div>
                <table id="families-table" style="display: none;">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Название</th>
                            <th>Email</th>
                            <th>Admin Pass</th>
                            <th>Child Pass</th>
                            <th>Заданий</th>
                            <th>Товаров</th>
                            <th>Статус</th>
                            <th>Дата создания</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="families-tbody">
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Catalog Tab -->
        <div id="tab-catalog" class="tab-content">
            <div class="catalog-section">
                <div class="section-header">
                    <h2>📋 Базовые Задания</h2>
                    <button class="add-btn" onclick="addItem('tasks')">+ Добавить Задание</button>
                </div>
                <div id="base-tasks-list" class="items-grid"></div>
            </div>

            <div class="catalog-section">
                <div class="section-header">
                    <h2>🏪 Базовые Товары</h2>
                    <button class="add-btn" onclick="addItem('products')">+ Добавить Товар</button>
                </div>
                <div id="base-products-list" class="items-grid"></div>
            </div>
        </div>
    </div>

    <!-- Modal for family details -->
    <div id="family-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close" id="modal-close">&times;</span>
            <h2 id="modal-title">Загрузка...</h2>
            <div id="modal-body" class="family-detail">
                <div class="loading">Загрузка данных...</div>
            </div>
        </div>
    </div>

    <!-- Modal for editing base item -->
    <div id="edit-modal" class="modal">
        <div class="modal-content" style="max-width: 500px;">
            <span class="modal-close" onclick="closeEditModal()">&times;</span>
            <h2 id="edit-modal-title">Редактирование</h2>
            <div id="edit-form-container"></div>
        </div>
    </div>

    <style>
        .tabs {
            margin-bottom: 2rem;
            border-bottom: 2px solid #ddd;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.2rem;
            font-weight: 700;
            color: #666;
            cursor: pointer;
            border-bottom: 3px solid transparent;
        }

        .tab-btn.active {
            color: #ffd700;
            border-bottom-color: #ffd700;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .item-card {
            background: white;
            padding: 1rem;
            border-radius: 0.5rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            border-left: 5px solid #ffd700;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .item-meta {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .item-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
        }

        .btn-sm {
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            border: none;
            cursor: pointer;
            color: white;
        }

        .btn-edit {
            background: #3498db;
        }

        .btn-del {
            background: #e74c3c;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 0.25rem;
        }

        .save-btn {
            width: 100%;
            padding: 1rem;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: bold;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .add-btn {
            padding: 0.5rem 1rem;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
        }
    </style>

    <script>
        let familiesData = [];
        let baseData = { tasks: [], products: [] };

        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
            });
        });

        // Logout
        document.getElementById('logout-btn').addEventListener('click', async () => {
            try {
                await fetch('/api/logout', { method: 'POST' });
                window.location.reload();
            } catch (err) {
                console.error('Logout error:', err);
            }
        });

        // Load families
        async function loadFamilies() {
            try {
                const res = await fetch('/api/super/families');
                if (res.ok) {
                    const data = await res.json();
                    familiesData = data.families || [];
                    renderFamilies();
                } else {
                    console.error('Failed to load families');
                    document.getElementById('loading').textContent = 'Ошибка загрузки';
                }
            } catch (err) {
                console.error('Error loading families:', err);
                document.getElementById('loading').textContent = 'Ошибка связи с сервером';
            }
        }

        // Load Base Data
        async function loadBaseData() {
            try {
                const res = await fetch('/api/super/base-data');
                if (res.ok) {
                    baseData = await res.json();
                    renderBaseData();
                }
            } catch (err) {
                console.error('Error loading base data:', err);
            }
        }

        // Render families table
        function renderFamilies() {
            const tbody = document.getElementById('families-tbody');
            tbody.innerHTML = '';

            if (familiesData.length === 0) {
                document.getElementById('loading').textContent = 'Нет магазинов';
                return;
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('families-table').style.display = 'table';

            // Update stats
            document.getElementById('total-families').textContent = familiesData.length;
            const latest = familiesData.length > 0 ? familiesData.reduce((latest, f) => {
                return new Date(f.created_at) > new Date(latest.created_at) ? f : latest;
            }, familiesData[0]) : null;

            if (latest) {
                const date = new Date(latest.created_at).toLocaleString('ru-RU');
                document.getElementById('latest-family').textContent = `${latest.name} (${date})`;
            } else {
                document.getElementById('latest-family').textContent = '-';
            }

            // Render table rows
            familiesData.forEach(family => {
                const tr = document.createElement('tr');
                const createdDate = new Date(family.created_at).toLocaleDateString('ru-RU');

                tr.innerHTML = `
                    <td style="opacity:0.5">#${family.id}</td>
                    <td><strong>${family.name}</strong></td>
                    <td>${family.email || '-'}</td>
                    <td><code>${family.adminPin || 'N/A'}</code></td>
                    <td><code>${family.childPin || 'N/A'}</code></td>
                    <td>${family.tasksCount || 0}</td>
                    <td>${family.shopCount || 0}</td>
                    <td>${family.isBlocked ? '<span style="color:red">BLOCKED</span>' : '<span style="color:green">ACTIVE</span>'}</td>
                    <td>${createdDate}</td>
                    <td>
                        <button class="view-btn" onclick="viewFamily('${family.id}')">Просмотр</button>
                        <button class="block-btn ${family.isBlocked ? 'unblock' : ''}" 
                                onclick="toggleBlock('${family.id}', ${!family.isBlocked})">
                            ${family.isBlocked ? 'Разблок.' : 'Блок.'}
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Render Base Data
        function renderBaseData() {
            renderList('tasks', baseData.tasks, document.getElementById('base-tasks-list'));
            renderList('products', baseData.products, document.getElementById('base-products-list'));
        }

        function renderList(type, items, container) {
            container.innerHTML = '';
            items.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="item-header">
                        <span>${item.name}</span>
                        <span>${item.coins || item.price} 🪙</span>
                    </div>
                    <div class="item-meta">
                        Возраст: ${item.age_min}-${item.age_max} лет
                    </div>
                    <div class="item-actions">
                        <button class="btn-sm btn-edit" onclick="editItem('${type}', ${index})">✏️</button>
                        <button class="btn-sm btn-del" onclick="deleteItem('${type}', ${index})">🗑️</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Edit Item
        window.editItem = (type, index) => {
            const item = index === -1 ? { name: '', age_min: 7, age_max: 18 } : (type === 'tasks' ? baseData.tasks[index] : baseData.products[index]);
            const isTask = type === 'tasks';

            const html = `
                <div class="input-group">
                    <label>Название</label>
                    <input type="text" id="edit-name" value="${item.name}">
                </div>
                <div class="input-group">
                    <label>${isTask ? 'Награда (монеты)' : 'Цена (монеты)'}</label>
                    <input type="number" id="edit-cost" value="${item.coins || item.price || 0}">
                </div>
                <div class="input-group">
                    <label>Возраст (мин)</label>
                    <input type="number" id="edit-min" value="${item.age_min}">
                </div>
                <div class="input-group">
                    <label>Возраст (макс)</label>
                    <input type="number" id="edit-max" value="${item.age_max}">
                </div>
                <button class="save-btn" onclick="saveItem('${type}', ${index})">Сохранить</button>
            `;

            document.getElementById('edit-form-container').innerHTML = html;
            document.getElementById('edit-modal-title').textContent = index === -1 ? 'Добавить' : 'Редактировать';
            document.getElementById('edit-modal').classList.add('active');
        };

        window.addItem = (type) => editItem(type, -1);

        window.saveItem = async (type, index) => {
            const newItem = {
                id: index === -1 ? Date.now().toString() : (type === 'tasks' ? baseData.tasks[index].id : baseData.products[index].id),
                name: document.getElementById('edit-name').value,
                age_min: parseInt(document.getElementById('edit-min').value),
                age_max: parseInt(document.getElementById('edit-max').value)
            };

            const cost = parseInt(document.getElementById('edit-cost').value);
            if (type === 'tasks') newItem.coins = cost;
            else newItem.price = cost;

            if (index === -1) {
                baseData[type].push(newItem);
            } else {
                baseData[type][index] = { ...baseData[type][index], ...newItem };
            }

            await saveBaseDataToServer();
            closeEditModal();
            renderBaseData();
        };

        window.deleteItem = async (type, index) => {
            if (confirm('Удалить?')) {
                baseData[type].splice(index, 1);
                await saveBaseDataToServer();
                renderBaseData();
            }
        };

        async function saveBaseDataToServer() {
            try {
                await fetch('/api/super/base-data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(baseData)
                });
            } catch (err) {
                alert('Ошибка сохранения');
            }
        }

        window.closeEditModal = () => {
            document.getElementById('edit-modal').classList.remove('active');
        };

        // View family details
        window.viewFamily = async (familyId) => {
            const modal = document.getElementById('family-modal');
            const modalTitle = document.getElementById('modal-title');
            const modalBody = document.getElementById('modal-body');

            modal.classList.add('active');
            modalTitle.textContent = 'Загрузка...';
            modalBody.innerHTML = '<div class="loading">Загрузка данных...</div>';

            try {
                const res = await fetch(`/api/super/family/${familyId}/data`);
                if (res.ok) {
                    const data = await res.json();
                    renderFamilyDetails(data);
                } else {
                    modalBody.innerHTML = '<p style="color: red;">Ошибка загрузки данных</p>';
                }
            } catch (err) {
                console.error('Error loading family data:', err);
                modalBody.innerHTML = '<p style="color: red;">Ошибка связи с сервером</p>';
            }
        };

        // Render family details in modal
        function renderFamilyDetails(familyData) {
            const modalTitle = document.getElementById('modal-title');
            const modalBody = document.getElementById('modal-body');

            modalTitle.textContent = familyData.familyInfo.name;

            let html = `
                <div class="detail-grid">
                    <div class="detail-item">
                        <strong>ID семьи</strong>
                        <div>#${familyData.familyId}</div>
                    </div>
                    <div class="detail-item">
                        <strong>Дата создания</strong>
                        <div>${new Date(familyData.familyInfo.created_at).toLocaleString('ru-RU')}</div>
                    </div>
                    <div class="detail-item">
                        <strong>Email</strong>
                        <div>${familyData.familyInfo.email || '-'}</div>
                    </div>
                    <div class="detail-item">
                        <strong>Баланс</strong>
                        <div>${familyData.data.balance} 🪙</div>
                    </div>
                </div>

                <h3>📋 Задания (${familyData.data.tasks.length})</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Название</th>
                            <th>Награда</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${familyData.data.tasks.map(task => `
                            <tr>
                                <td>${task.name}</td>
                                <td>${task.coins} 🪙</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>

                <h3>🏪 Магазин (${familyData.data.shop.length})</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Название</th>
                            <th>Цена</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${familyData.data.shop.map(item => `
                            <tr>
                                <td>${item.name}</td>
                                <td>${item.price} 🪙</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>

                <h3>📜 История (${familyData.data.history.length})</h3>
                ${familyData.data.history.length === 0 ? '<p>Нет записей</p>' : `
                    <table>
                        <tbody>
                            ${familyData.data.history.slice(-10).reverse().map(h => `
                                <tr>
                                    <td>${new Date(h.timestamp).toLocaleString('ru-RU')}</td>
                                    <td>${h.action}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `}
            `;

            modalBody.innerHTML = html;
        }

        // Close modal
        document.getElementById('modal-close').addEventListener('click', () => {
            document.getElementById('family-modal').classList.remove('active');
        });

        // Close modal on outside click
        document.getElementById('family-modal').addEventListener('click', (e) => {
            if (e.target.id === 'family-modal') {
                document.getElementById('family-modal').classList.remove('active');
            }
        });

        // Initialize
        loadFamilies();
        loadBaseData();

        async function toggleBlock(familyId, shouldBlock) {
            if (!confirm(shouldBlock ? 'Заблокировать магазин?' : 'Разблокировать магазин?')) return;

            try {
                const res = await fetch(`/api/super/family/${familyId}/block`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ isBlocked: shouldBlock })
                });

                if (res.ok) {
                    loadFamilies(); // Reload
                } else {
                    alert('Ошибка обновления статуса');
                }
            } catch (err) {
                console.error(err);
                alert('Ошибка сети');
            }
        }
    </script>
</body>

</html>
