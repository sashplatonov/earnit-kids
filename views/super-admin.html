<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin - Управление Магазинами</title>
    <link rel="stylesheet" href="super-admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22%23ffd700%22 /><text x=%2250%22 y=%2265%22 font-family=%22sans-serif%22 font-size=%2250%22 text-anchor=%22middle%22 fill=%22black%22>C</text></svg>">
</head>

<body>
    <div class="super-admin-container">
        <div class="super-header">
            <h1>🔐 Super Admin Panel</h1>
            <button id="logout-btn" class="logout-btn">Выйти</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="families">Магазины</button>
            <button class="tab-btn" data-tab="catalog">Базовый Каталог</button>
        </div>

        <!-- Families Tab -->
        <div id="tab-families" class="tab-content active">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Всего Магазинов</h3>
                    <div class="value" id="total-families">-</div>
                </div>
                <div class="stat-card" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                    <h3>Последний Созданный</h3>
                    <div class="value" style="font-size: 1.2rem;" id="latest-family">-</div>
                </div>
            </div>

            <div class="families-table">
                <h2>📊 Все Магазины Монет</h2>
                <div id="loading" class="loading">Загрузка...</div>
                <table id="families-table" style="display: none;">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Название</th>
                            <th>Email</th>
                            <th>Admin Pass</th>
                            <th>Magic Link</th>
                            <th>Заданий</th>
                            <th>Товаров</th>
                            <th>Статус</th>
                            <th>Дата создания</th>
                            <th>Последняя активность</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="families-tbody">
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Catalog Tab -->
        <div id="tab-catalog" class="tab-content">
            <div class="catalog-section">
                <div class="section-header">
                    <h2>📋 Базовые Задания</h2>
                    <button class="add-btn" onclick="addItem('tasks')">+ Добавить Задание</button>
                </div>
                <div id="base-tasks-list" class="items-grid"></div>
            </div>

            <div class="catalog-section">
                <div class="section-header">
                    <h2>🏪 Базовые Товары</h2>
                    <button class="add-btn" onclick="addItem('products')">+ Добавить Товар</button>
                </div>
                <div id="base-products-list" class="items-grid"></div>
            </div>
        </div>
    </div>

    <!-- Modal for family details -->
    <div id="family-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close" id="modal-close">&times;</span>
            <h2 id="modal-title">Загрузка...</h2>
            <div id="modal-body" class="family-detail">
                <div class="loading">Загрузка данных...</div>
            </div>
        </div>
    </div>

    <!-- Modal for editing base item -->
    <div id="edit-modal" class="modal">
        <div class="modal-content" style="max-width: 500px;">
            <span class="modal-close" onclick="closeEditModal()">&times;</span>
            <h2 id="edit-modal-title">Редактирование</h2>
            <div id="edit-form-container"></div>
        </div>
    </div>

    <script src="js/super-admin.js"></script>
</body>

</html>
