<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Сброс пароля - Coins Kids Shop</title>
    <meta name="description" content="Сброс пароля для аккаунта в Магазине Монеток.">
    <link rel="canonical" href="{{CANONICAL_URL}}">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Open+Sans:wght@400;600&display=swap"
        rel="stylesheet">
    {{CLARITY_SCRIPT}}
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background-color: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .logo {
            font-family: 'Fredoka One', cursive;
            font-size: 2rem;
            color: #FFD700;
            text-shadow: 2px 2px #f39c12;
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #4a5568;
        }

        .input-group input {
            width: 90%;
            padding: 0.75rem;
            border: 2px solid #e2e8f0;
            border-radius: 0.5rem;
            font-size: 1rem;
        }

        .btn-primary {
            background-color: #4CAF50;
            color: white;
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 2rem;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        #message {
            margin-top: 1rem;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }

        .error {
            background: #ffebee;
            color: #c62828;
        }

        .success {
            background: #e8f5e9;
            color: #2e7d32;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="logo">🪙 Coins Shop</div>
        <h2>Новый пароль</h2>
        <form id="resetForm">
            <input type="hidden" id="token" name="token">
            <input type="hidden" id="email" name="email">

            <div class="input-group">
                <label for="password">Новый пароль</label>
                <input type="password" id="password" name="password" required minlength="6"
                    placeholder="Минимум 6 символов">
            </div>

            <div class="input-group">
                <label for="confirmPassword">Подтвердите пароль</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6"
                    placeholder="Повторите пароль">
            </div>

            <button type="submit" class="btn-primary">Сохранить</button>
        </form>
        <div id="message"></div>
        <p style="margin-top: 1rem;">
            <a href="/login.html" style="color: #4a5568; text-decoration: none;">Вернуться ко входу</a>
        </p>
    </div>

    <script>
        // Get params from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const email = urlParams.get('email');

        if (!token || !email) {
            document.getElementById('resetForm').style.display = 'none';
            const msg = document.getElementById('message');
            msg.textContent = 'Неверная ссылка для сброса пароля.';
            msg.className = 'error';
            msg.style.display = 'block';
        } else {
            document.getElementById('token').value = token;
            document.getElementById('email').value = email;
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageDiv = document.getElementById('message');

            if (password !== confirmPassword) {
                messageDiv.textContent = 'Пароли не совпадают';
                messageDiv.className = 'error';
                messageDiv.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, email, password })
                });

                const data = await response.json();

                if (data.success) {
                    messageDiv.textContent = 'Пароль успешно изменен! Перенаправление...';
                    messageDiv.className = 'success';
                    messageDiv.style.display = 'block';
                    document.getElementById('resetForm').style.display = 'none';
                    setTimeout(() => window.location.href = '/login.html', 2000);
                } else {
                    messageDiv.textContent = data.error || 'Ошибка смены пароля';
                    messageDiv.className = 'error';
                    messageDiv.style.display = 'block';
                }
            } catch (err) {
                messageDiv.textContent = 'Ошибка сервера';
                messageDiv.className = 'error';
                messageDiv.style.display = 'block';
            }
        });
    </script>
</body>

</html>
