<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Сброс пароля - EarnIt Kids</title>
    <meta name="description" content="Сброс пароля для аккаунта в EarnIt Kids.">
    <link rel="canonical" href="{{CANONICAL_URL}}">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#fff3e0">
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Open+Sans:wght@400;600&display=swap"
        rel="stylesheet">
    {{CLARITY_SCRIPT}}
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            background:
                radial-gradient(620px 360px at 10% 0%, rgba(92, 199, 243, 0.18), transparent 58%),
                radial-gradient(560px 320px at 100% 0%, rgba(255, 214, 107, 0.24), transparent 52%),
                linear-gradient(180deg, #fffdf8 0%, #f5fbff 52%, #fff4e8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 1rem;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.94);
            padding: 2rem;
            border-radius: 1.5rem;
            border: 1px solid rgba(125, 149, 187, 0.16);
            box-shadow: 0 24px 48px rgba(110, 136, 184, 0.14);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .logo {
            font-family: 'Fredoka One', cursive;
            font-size: 2rem;
            color: #ffb65c;
            text-shadow: 2px 2px #ffd86f;
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #4f6280;
        }

        .input-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid rgba(125, 149, 187, 0.22);
            border-radius: 0.85rem;
            font-size: 1rem;
            background: #ffffff;
            color: #26344f;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ffb65c, #ff8f70);
            color: white;
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 2rem;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s;
            box-shadow: 0 16px 28px rgba(255, 143, 112, 0.24);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        #message {
            margin-top: 1rem;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }

        .error {
            background: #ffebee;
            color: #c62828;
        }

        .success {
            background: #e8f5e9;
            color: #2e7d32;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="logo">🪙 Coins Shop</div>
        <h2>Новый пароль</h2>
        <form id="resetForm">
            <input type="hidden" id="token" name="token">
            <input type="hidden" id="email" name="email">

            <div class="input-group">
                <label for="password">Новый пароль</label>
                <input type="password" id="password" name="password" required minlength="6"
                    placeholder="Минимум 6 символов">
            </div>

            <div class="input-group">
                <label for="confirmPassword">Подтвердите пароль</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6"
                    placeholder="Повторите пароль">
            </div>

            <button type="submit" class="btn-primary">Сохранить</button>
        </form>
        <div id="message"></div>
        <p style="margin-top: 1rem;">
            <a href="/login.html" style="color: #4a5568; text-decoration: none;">Вернуться ко входу</a>
        </p>
    </div>

    <script src="/js/client-error-reporter.js"></script>
    <script>
        // Get params from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const email = urlParams.get('email');

        if (!token || !email) {
            document.getElementById('resetForm').style.display = 'none';
            const msg = document.getElementById('message');
            msg.textContent = 'Неверная ссылка для сброса пароля.';
            msg.className = 'error';
            msg.style.display = 'block';
        } else {
            document.getElementById('token').value = token;
            document.getElementById('email').value = email;
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageDiv = document.getElementById('message');

            if (password !== confirmPassword) {
                messageDiv.textContent = 'Пароли не совпадают';
                messageDiv.className = 'error';
                messageDiv.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, email, password })
                });

                const data = await response.json();

                if (data.success) {
                    messageDiv.textContent = 'Пароль успешно изменен! Перенаправление...';
                    messageDiv.className = 'success';
                    messageDiv.style.display = 'block';
                    document.getElementById('resetForm').style.display = 'none';
                    setTimeout(() => window.location.href = '/login.html', 2000);
                } else {
                    messageDiv.textContent = data.error || 'Ошибка смены пароля';
                    messageDiv.className = 'error';
                    messageDiv.style.display = 'block';
                }
            } catch (err) {
                messageDiv.textContent = 'Ошибка сервера';
                messageDiv.className = 'error';
                messageDiv.style.display = 'block';
            }
        });
    </script>
</body>

</html>
