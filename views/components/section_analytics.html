<section id="analytics-section" class="section hidden">
    <div class="container">
        <header class="section-header">
            <h2 class="section-title">📊 Мои достижения</h2>
            <div class="analytics-filters">
                <div class="tab-group" id="analytics-timeframe-group">
                    <button class="tab-btn" data-timeframe="week">Неделя</button>
                    <button class="tab-btn active" data-timeframe="month">Месяц</button>
                    <button class="tab-btn" data-timeframe="year">Год</button>
                </div>
            </div>
        </header>

        <!-- Summary Cards -->
        <div class="analytics-summary">
            <div class="stat-card">
                <div class="stat-card__label">Заработано</div>
                <div class="stat-card__value earn" id="stats-earned">0 🪙</div>
            </div>
            <div class="stat-card">
                <div class="stat-card__label">Потрачено</div>
                <div class="stat-card__value spend" id="stats-spent">0 🪙</div>
            </div>
            <div class="stat-card">
                <div class="stat-card__label">Платежный баланс</div>
                <div class="stat-card__value" id="stats-net">0 🪙</div>
            </div>
        </div>

        <!-- Charts Grid -->
        <div class="analytics-sections">
            <div class="analytics-group">
                <h3 class="analytics-group-title">📋 Задания <span id="tasks-total-coins"
                        class="group-total-badge"></span></h3>
                <div class="analytics-grid">
                    <div class="card analytics-chart-card">
                        <h4 class="card__subtitle">По сумме монет</h4>
                        <div class="chart-container">
                            <canvas id="tasks-coins-chart"></canvas>
                        </div>
                    </div>
                    <div class="card analytics-chart-card">
                        <h4 class="card__subtitle">По количеству раз</h4>
                        <div class="chart-container">
                            <canvas id="tasks-count-chart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <div class="analytics-group">
                <h3 class="analytics-group-title">🛒 Магазин и траты <span id="items-total-coins"
                        class="group-total-badge"></span></h3>
                <div class="analytics-grid">
                    <div class="card analytics-chart-card">
                        <h4 class="card__subtitle">По сумме монет</h4>
                        <div class="chart-container">
                            <canvas id="items-coins-chart"></canvas>
                        </div>
                    </div>
                    <div class="card analytics-chart-card">
                        <h4 class="card__subtitle">По количеству раз</h4>
                        <div class="chart-container">
                            <canvas id="items-count-chart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Trends Section -->
            <div class="analytics-group">
                <h3 class="analytics-group-title">📈 Динамика достижений</h3>
                <div class="card analytics-chart-card">
                    <div class="chart-container">
                        <canvas id="achievements-trend-chart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Recommendations Section -->
            <div class="analytics-group">
                <h3 class="analytics-group-title">💡 Идеи для роста</h3>
                <div id="analytics-recommendations" class="recommendations-grid">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>
    </div>
</section>
