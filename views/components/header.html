<header class="header">
    <div class="header__logo">
        <span class="header__icon">🪙</span>
        <h1>Монетки</h1>
    </div>
    <div class="header__balance">
        <span class="balance__label">Баланс:</span>
        <span class="balance__value" id="balance">0</span>
        <span class="balance__coin">🪙</span>
    </div>
    <div class="header__actions" style="display: flex; gap: 0.5rem;">
        <button class="btn btn--secondary hidden" id="settings-btn" title="Настройки">
            ⚙️
        </button>
        <button class="btn btn--admin" id="admin-toggle">
            <span class="btn__icon">🔐</span>
            <span class="btn__text">Вход админа</span>
        </button>
    </div>
</header>
