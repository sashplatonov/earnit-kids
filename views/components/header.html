<header class="header">
    <div class="header__logo">
        <span class="header__icon">🪙</span>
        <div class="header__titles">
            <h1>Монетки</h1>
            <div class="header__shop-container"
                style="display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;">
                <div id="shop-name-display" class="header__shop-name"
                    style="font-size: 1.2rem; font-weight: 800; letter-spacing: 0.5px;"></div>
                <div id="child-nickname-display" class="header__child-nickname"
                    style="font-size: 1rem; color: var(--primary-color); font-weight: 600; opacity: 0.9;"></div>
            </div>
        </div>
    </div>
    <div class="header__version" style="font-size: 0.8rem; color: #666; margin-top: 5px;">Версия: {{APP_VERSION}}</div>
    <div class="header__balance">
        <span class="balance__label">Баланс:</span>
        <span class="balance__value" id="balance">0</span>
        <span class="balance__coin">🪙</span>
        <span class="header__earned-summary" id="header-earned-summary">Сегодня: 0/∞ 🪙</span>
        <button class="btn btn--success btn--small admin-only hidden" onclick="window.app.adminAwardCoins()" style="margin-left: 5px; border-radius: 50%; width: 24px; height: 24px; padding: 0; display: inline-flex; align-items: center; justify-content: center; font-size: 1rem;" title="Начислить монеты">+</button>
    </div>
    <div class="header__actions" style="display: flex; gap: 0.5rem; align-items: center;">
        <div id="child-switcher-container" class="admin-only hidden"></div>
        <button class="btn btn--danger" id="logout-btn" title="Выход">
            🚪
        </button>
    </div>
</header>
