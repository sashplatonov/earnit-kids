<header class="header">
    <div class="header__logo">
        <span class="header__icon">🪙</span>
        <div class="header__titles">
            <h1>Монетки</h1>
            <div id="shop-name-display" class="header__shop-name"
                style="font-size: 0.8rem; opacity: 0.7; font-weight: 500;"></div>
        </div>
    </div>
    <div class="header__balance">
        <span class="balance__label">Баланс:</span>
        <span class="balance__value" id="balance">0</span>
        <span class="balance__coin">🪙</span>
    </div>
    <div class="header__actions" style="display: flex; gap: 0.5rem;">
        <button class="btn btn--secondary hidden" id="child-link-btn" title="Ссылка для ребенка">
            🔗
        </button>
        <button class="btn btn--secondary" id="change-pin-btn" title="Сменить Пароль">
            🔑
        </button>
        <button class="btn btn--danger" id="logout-btn" title="Выход">
            🚪
        </button>
    </div>
</header>
