<!-- Секция заданий -->
<section class="section" id="tasks-section">
    <div class="section__header">
        <div class="section__header-titles">
            <h2><span class="gamified-icon icon-tasks" aria-hidden="true" style="width: 1.5rem; height: 1.5rem; margin-right: 0.5rem; vertical-align: middle;"></span> За что можно заработать</h2>
            <p class="section__subtitle">Выполняйте задания, чтобы получать монетки и опыт</p>
        </div>
        <div class="section__buttons admin-only hidden">
            <button class="btn btn--add" id="add-task-btn">+ Добавить</button>
        </div>
    </div>
    <div class="group-nav hidden" id="tasks-group-nav"></div>
    <div class="cards" id="tasks-list">
        <!-- Карточки заданий -->
    </div>
    <div class="empty-state hidden" id="tasks-empty">
        <span class="empty-state__icon">
            <span class="gamified-icon icon-empty" aria-hidden="true"></span>
        </span>
        <p class="empty-state__title">Пока нет заданий</p>
        <p class="empty-state__hint">Создайте первую задачу — она сразу появится в списке ребенка.</p>
        <div class="empty-state__actions">
            <span class="empty-state__tip">Кнопка «+ Добавить» в правом верхнем углу раздела.</span>
        </div>
    </div>
</section>
