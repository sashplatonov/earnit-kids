<!-- Секция заданий -->
<section class="section" id="tasks-section">
    <div class="section__header">
        <h2>За что можно заработать</h2>
        <div class="section__buttons admin-only hidden">
            <button class="btn btn--add" id="add-task-btn">+ Добавить</button>
        </div>
    </div>
    <div class="group-nav hidden" id="tasks-group-nav"></div>
    <div class="cards" id="tasks-list">
        <!-- Карточки заданий -->
    </div>
    <div class="empty-state" id="tasks-empty">
        <span class="empty-state__icon">
            <span class="gamified-icon icon-empty" aria-hidden="true"></span>
        </span>
        <p class="empty-state__title">Пока нет заданий</p>
        <p class="empty-state__hint">Создайте первую задачу — она появится в следующем “Сегодня” ребенка.</p>
        <div class="empty-state__actions">
            <span class="empty-state__tip">Кнопка «+ Добавить» в правом верхнем углу раздела.</span>
        </div>
    </div>
</section>
