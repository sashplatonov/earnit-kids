<!-- Секция магазина -->
<section class="section hidden" id="shop-section">

        <h2>Магазин наград</h2>
        <div class="section__buttons admin-only hidden">
            <button class="btn btn--add" id="add-shop-btn">+ Добавить</button>
            <button class="btn btn--secondary" id="import-shop-btn">📋 Быстрый импорт</button>
        </div>
    </div>
    <div class="cards" id="shop-list">

    </div>

    </div>
</section>
