<!-- Секция магазина -->
<section class="section hidden" id="shop-section">
    <div class="section__header">
        <h2>Магазин наград</h2>
        <div class="section__buttons admin-only hidden">
            <button class="btn btn--add" id="add-shop-btn">+ Добавить</button>
        </div>
    </div>
    <div class="group-nav hidden" id="shop-group-nav"></div>
    <div class="cards" id="shop-list">
        <!-- Карточки товаров -->
    </div>
    <div class="empty-state" id="shop-empty">
        <span class="empty-state__icon">
            <span class="gamified-icon icon-shop" aria-hidden="true"></span>
        </span>
        <p class="empty-state__title">Магазин пока пуст</p>
        <p class="empty-state__hint">Добавьте первую награду, и магазин сразу станет понятной целью для ребенка.</p>
        <div class="empty-state__actions">
            <span class="empty-state__tip">Нажмите «+ Добавить», чтобы наполнить магазин монет первыми призами.</span>
        </div>
    </div>
</section>
