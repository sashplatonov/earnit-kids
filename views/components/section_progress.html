<!-- Секция Прогресс -->
<section class="section hidden" id="progress-section">
    <div class="section__header">
        <h2>Прогресс</h2>
        <p class="section__subtitle">Старайтесь каждый день: XP, streak и недельная цель в одном потоке.</p>
        <div class="progress-card__child" id="progress-child-name">Статистика для всех детей</div>
    </div>
    <div class="progress-grid">
        <article class="progress-card">
            <div class="progress-card__label">Неделя: заработано</div>
            <div class="progress-card__value" id="progress-week-earned-value">0</div>
            <div class="progress-card__meter">
                <div class="progress-card__fill" id="progress-week-earned-bar"></div>
            </div>
            <div class="progress-card__footnote" id="progress-week-earned-goal">Цель: 200</div>
        </article>
        <article class="progress-card progress-card--spent">
            <div class="progress-card__label">Неделя: потрачено</div>
            <div class="progress-card__value" id="progress-week-spent-value">0</div>
            <div class="progress-card__meter">
                <div class="progress-card__fill" id="progress-week-spent-bar"></div>
            </div>
            <div class="progress-card__footnote" id="progress-week-spent-note">Цель: не больше 150</div>
        </article>
        <article class="progress-card progress-card--level">
            <div class="progress-card__label">Уровень</div>
            <div class="progress-card__value" id="progress-level-value">1</div>
            <div class="progress-card__meter">
                <div class="progress-card__fill" id="progress-level-bar"></div>
            </div>
            <div class="progress-card__footnote" id="progress-level-note">до следующего уровня 120 XP</div>
        </article>
        <article class="progress-card progress-card--streak">
            <div class="progress-card__label">Серия дней</div>
            <div class="progress-card__value" id="progress-streak-value">0</div>
            <p class="progress-card__note" id="progress-streak-note">дней подряд с задачей</p>
        </article>
    </div>
</section>
