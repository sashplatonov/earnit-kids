<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Монетки</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --login-bg: radial-gradient(circle at top right, #1a1a2e, #16213e);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
        }

        .login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
            background: var(--login-bg);
            font-family: 'Nunito', sans-serif;
            color: white;
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid var(--card-border);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-logo {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            display: inline-block;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.3));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .login-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ffd700 0%, #ffae00 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-subtitle {
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 2.5rem;
            font-weight: 600;
        }

        .pin-container {
            margin-bottom: 2rem;
        }

        .pin-input {
            background: rgba(0, 0, 0, 0.2);
            border: 2px solid var(--card-border);
            border-radius: 1rem;
            color: white;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 0.5em;
            padding: 1rem;
            text-align: center;
            width: 100%;
            transition: all 0.3s ease;
            outline: none;
        }

        .pin-input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
            background: rgba(0, 0, 0, 0.3);
        }

        .btn-login {
            background: linear-gradient(135deg, #ffd700 0%, #ffae00 100%);
            border: none;
            border-radius: 1rem;
            color: #1a1a2e;
            cursor: pointer;
            font-size: 1.25rem;
            font-weight: 800;
            padding: 1.25rem;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -5px rgba(255, 174, 0, 0.4);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(255, 174, 0, 0.5);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid rgba(255, 71, 87, 0.2);
            border-radius: 0.75rem;
            color: #ff4757;
            font-weight: 700;
            margin-top: 1.5rem;
            padding: 1rem;
            display: none;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }
    </style>
</head>

<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-logo">🪙</div>
            <h1 class="login-title">Магазин Монеток</h1>
            <p class="login-subtitle">Введите ПИН-код для входа</p>

            <div class="pin-container">
                <input type="password" id="pin-input" class="pin-input" placeholder="••••••" inputmode="numeric"
                    maxlength="10" autocomplete="current-password">
            </div>

            <button id="login-btn" class="btn-login">Войти</button>

            <div id="error-msg" class="error-message">
                ❌ Неверный ПИН-код
            </div>
        </div>
    </div>

    <script>
        const btn = document.getElementById('login-btn');
        const input = document.getElementById('pin-input');
        const error = document.getElementById('error-msg');

        async function doLogin() {
            const pin = input.value;
            if (pin.length < 6) {
                showError('ПИН-код должен быть не менее 6 знаков');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Вход...';
            error.style.display = 'none';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin })
                });

                const data = await res.json();

                if (res.ok) {
                    window.location.reload();
                } else {
                    showError(data.error || 'Ошибка входа');
                    btn.textContent = 'Войти';
                    btn.disabled = false;
                    input.value = '';
                    input.focus();
                }
            } catch (err) {
                console.error(err);
                showError('Ошибка связи с сервером');
                btn.textContent = 'Войти';
                btn.disabled = false;
            }
        }

        function showError(msg) {
            error.textContent = '❌ ' + msg;
            error.style.display = 'block';
            // Trigger shake animation
            error.style.animation = 'none';
            error.offsetHeight; // force reflow
            error.style.animation = null;
        }

        btn.addEventListener('click', doLogin);
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') doLogin();
        });

        // Auto-focus on load
        window.addEventListener('load', () => input.focus());
    </script>
</body>

</html>
