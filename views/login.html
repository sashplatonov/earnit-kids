<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Монетки</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22%23ffd700%22 /><text x=%2250%22 y=%2265%22 font-family=%22sans-serif%22 font-size=%2250%22 text-anchor=%22middle%22 fill=%22black%22>C</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --login-bg: radial-gradient(circle at top right, #1a1a2e, #16213e);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
        }

        .login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
            background: var(--login-bg);
            font-family: 'Nunito', sans-serif;
            color: white;
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid var(--card-border);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-logo {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            display: inline-block;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.3));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .login-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ffd700 0%, #ffae00 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-subtitle {
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 2.5rem;
            font-weight: 600;
        }

        .pin-container {
            margin-bottom: 1.5rem;
        }

        .input-field {
            background: rgba(0, 0, 0, 0.2);
            border: 2px solid var(--card-border);
            border-radius: 1rem;
            color: white;
            font-size: 1.25rem;
            font-weight: 700;
            padding: 1rem;
            text-align: center;
            width: 100%;
            transition: all 0.3s ease;
            outline: none;
            margin-bottom: 1rem;
            box-sizing: border-box;
        }

        .input-field.pin-input {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.1em;
        }

        .input-field:focus {
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
            background: rgba(0, 0, 0, 0.3);
        }

        .btn-login {
            background: linear-gradient(135deg, #ffd700 0%, #ffae00 100%);
            border: none;
            border-radius: 1rem;
            color: #1a1a2e;
            cursor: pointer;
            font-size: 1.25rem;
            font-weight: 800;
            padding: 1.25rem;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -5px rgba(255, 174, 0, 0.4);
            margin-bottom: 1rem;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(255, 174, 0, 0.5);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 1rem;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            padding: 0.75rem;
            width: 100%;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            border-color: #ffd700;
            color: #ffd700;
        }

        .error-message {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid rgba(255, 71, 87, 0.2);
            border-radius: 0.75rem;
            color: #ff4757;
            font-weight: 700;
            margin-top: 1rem;
            padding: 1rem;
            display: none;
            animation: shake 0.4s ease-in-out;
        }

        .success-message {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 0.75rem;
            color: #10b981;
            font-weight: 700;
            margin-top: 1rem;
            padding: 1rem;
            display: none;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        .hidden {
            display: none !important;
        }

        .register-form {
            display: none;
        }

        .register-form.active {
            display: block;
        }

        .login-form.hidden {
            display: none;
        }

        .form-label {
            display: block;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            text-align: left;
        }
    </style>
</head>

<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-logo">🪙</div>
            <h1 class="login-title">Магазин Монеток</h1>

            <!-- Login Form -->
            <div id="login-form" class="login-form">
                <p class="login-subtitle">Введите Email и Пароль для входа</p>

                <div class="pin-container">
                    <input type="email" id="email-input" class="input-field" placeholder="Email"
                        autocomplete="username">
                    <input type="password" id="pin-input" class="input-field pin-input" placeholder="Пароль"
                        autocomplete="current-password">
                </div>

                <button id="login-btn" class="btn-login">Войти</button>
                <div style="margin-top: 1rem; margin-bottom: 1rem;">
                    <a href="#" id="forgot-password-link"
                        style="color: rgba(255,255,255,0.5); text-decoration: none; font-size: 0.9rem;">Забыли
                        пароль?</a>
                </div>
                <button id="show-register-btn" class="btn-secondary">Создать Новый Магазин Монет</button>
            </div>

            <!-- Register Form -->
            <div id="register-form" class="register-form">
                <p class="login-subtitle">Создание Нового Магазина Монет</p>

                <div class="pin-container">
                    <label class="form-label">Название магазина</label>
                    <input type="text" id="family-name" class="input-field" placeholder="Например: Семья Ивановых">

                    <label class="form-label">Email родителя</label>
                    <input type="email" id="reg-email" class="input-field" placeholder="Email для входа">

                    <label class="form-label">Пароль родителя (мин. 6 символов)</label>
                    <input type="password" id="admin-pin" class="input-field pin-input" placeholder="Пароль">

                    <label class="form-label">Пароль ребёнка (мин. 6 символов)</label>
                    <input type="password" id="child-pin" class="input-field pin-input" placeholder="Пароль">
                </div>

                <button id="register-btn" class="btn-login">Зарегистрировать</button>
                <button id="show-login-btn" class="btn-secondary">Уже есть аккаунт? Войти</button>
            </div>

            <!-- Forgot Password Modal (hidden by default) -->
            <div id="forgot-password-form" class="register-form">
                <p class="login-subtitle">Восстановление пароля</p>
                <p style="color: rgba(255, 255, 255, 0.6); font-size: 0.9rem; margin-bottom: 1.5rem;">
                    Введите ваш Email, и мы отправим вам пароли администратора и ребёнка.
                </p>
                <div class="pin-container">
                    <input type="email" id="forgot-email" class="input-field" placeholder="Ваш Email">
                </div>
                <button id="send-recovery-btn" class="btn-login">Отправить</button>
                <button id="show-login-from-forgot-btn" class="btn-secondary">Вернуться ко входу</button>
            </div>

            <div id="error-msg" class="error-message"></div>
            <div id="success-msg" class="success-message"></div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const loginBtn = document.getElementById('login-btn');
        const registerBtn = document.getElementById('register-btn');
        const showRegisterBtn = document.getElementById('show-register-btn');
        const showLoginBtn = document.getElementById('show-login-btn');
        const forgotPasswordLink = document.getElementById('forgot-password-link');
        const forgotPasswordForm = document.getElementById('forgot-password-form');
        const showLoginFromForgotBtn = document.getElementById('show-login-from-forgot-btn');
        const sendRecoveryBtn = document.getElementById('send-recovery-btn');
        const forgotEmailInput = document.getElementById('forgot-email');

        const pinInput = document.getElementById('pin-input');
        const emailInput = document.getElementById('email-input');
        const errorMsg = document.getElementById('error-msg');
        const successMsg = document.getElementById('success-msg');

        // Toggle forms
        showRegisterBtn.addEventListener('click', () => {
            loginForm.classList.add('hidden');
            registerForm.classList.add('active');
            hideMessages();
        });

        showLoginBtn.addEventListener('click', () => {
            loginForm.classList.remove('hidden');
            registerForm.classList.remove('active');
            forgotPasswordForm.classList.remove('active');
            hideMessages();
        });

        forgotPasswordLink.addEventListener('click', (e) => {
            e.preventDefault();
            loginForm.classList.add('hidden');
            registerForm.classList.remove('active');
            forgotPasswordForm.classList.add('active');
            hideMessages();
        });

        showLoginFromForgotBtn.addEventListener('click', () => {
            loginForm.classList.remove('hidden');
            forgotPasswordForm.classList.remove('active');
            hideMessages();
        });

        function hideMessages() {
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
        }

        function showError(msg) {
            errorMsg.textContent = '❌ ' + msg;
            errorMsg.style.display = 'block';
            successMsg.style.display = 'none';
            errorMsg.style.animation = 'none';
            errorMsg.offsetHeight;
            errorMsg.style.animation = null;
        }

        function showSuccess(msg) {
            successMsg.textContent = '✅ ' + msg;
            successMsg.style.display = 'block';
            errorMsg.style.display = 'none';
        }

        // Login
        async function doLogin() {
            const email = emailInput.value.trim();
            const pin = pinInput.value;

            // Allow super admin login without email (or check logic later)
            if (pin !== '000000' && !email) {
                showError('Введите Email');
                return;
            }

            if (pin.length < 6) {
                showError('Пароль должен быть не менее 6 знаков');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = 'Вход...';
            hideMessages();

            try {
                const res = await fetch('api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, pin })
                });

                const data = await res.json();

                if (res.ok) {
                    window.location.reload();
                } else {
                    showError(data.error || 'Ошибка входа');
                    loginBtn.textContent = 'Войти';
                    loginBtn.disabled = false;
                    pinInput.value = '';
                }
            } catch (err) {
                console.error(err);
                showError('Ошибка связи с сервером');
                loginBtn.textContent = 'Войти';
                loginBtn.disabled = false;
            }
        }

        // Register
        async function doRegister() {
            const familyName = document.getElementById('family-name').value.trim();
            const regEmail = document.getElementById('reg-email').value.trim();
            const adminPin = document.getElementById('admin-pin').value;
            const childPin = document.getElementById('child-pin').value;

            if (!regEmail || !regEmail.includes('@')) {
                showError('Введите корректный Email');
                return;
            }

            if (adminPin.length < 6 || childPin.length < 6) {
                showError('Пароли должны быть не менее 6 символов');
                return;
            }

            if (adminPin === childPin) {
                showError('Пароли родителя и ребёнка должны быть разными');
                return;
            }

            registerBtn.disabled = true;
            registerBtn.textContent = 'Регистрация...';
            hideMessages();

            try {
                const res = await fetch('api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ familyName, email: regEmail, adminPin, childPin })
                });

                const data = await res.json();

                if (res.ok) {
                    showSuccess('Семья зарегистрирована! Теперь войдите.');
                    registerBtn.textContent = 'Зарегистрировать';
                    registerBtn.disabled = false;

                    // Switch to login form and prefill email
                    setTimeout(() => {
                        showLoginBtn.click();
                        emailInput.value = regEmail;
                        pinInput.focus();
                    }, 1500);
                } else {
                    showError(data.error || 'Ошибка регистрации');
                    registerBtn.textContent = 'Зарегистрировать';
                    registerBtn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                showError('Ошибка связи с сервером');
                registerBtn.textContent = 'Зарегистрировать';
                registerBtn.disabled = false;
            }
        }

        // Password Recovery
        async function doRecover() {
            const email = forgotEmailInput.value.trim();
            if (!email || !email.includes('@')) {
                showError('Введите корректный Email');
                return;
            }

            sendRecoveryBtn.disabled = true;
            sendRecoveryBtn.textContent = 'Отправка...';
            hideMessages();

            try {
                const res = await fetch('api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();

                if (res.ok) {
                    showSuccess('Пароли отправлены на ваш Email!');
                    setTimeout(() => {
                        showLoginFromForgotBtn.click();
                        emailInput.value = email;
                    }, 3000);
                } else {
                    showError(data.error || 'Ошибка восстановления');
                    sendRecoveryBtn.disabled = false;
                    sendRecoveryBtn.textContent = 'Отправить';
                }
            } catch (err) {
                console.error(err);
                showError('Ошибка связи с сервером');
                sendRecoveryBtn.disabled = false;
                sendRecoveryBtn.textContent = 'Отправить';
            }
        }

        loginBtn.addEventListener('click', doLogin);
        registerBtn.addEventListener('click', doRegister);
        sendRecoveryBtn.addEventListener('click', doRecover);

        pinInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') doLogin();
        });

        forgotEmailInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') doRecover();
        });

        // Auto-focus on load and check errors
        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const error = urlParams.get('error');
            if (error === 'invalid_token') {
                showError('Недействительная или просроченная ссылка для входа.');
            }
            if (emailInput) emailInput.focus();
        });
    </script>
</body>

</html>
