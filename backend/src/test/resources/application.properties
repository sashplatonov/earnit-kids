# Test profile — uses H2 in-memory DB for fast tests without PostgreSQL
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=

quarkus.flyway.migrate-at-start=true
quarkus.flyway.clean-at-start=true
quarkus.flyway.locations=classpath:db/migration

quarkus.hibernate-orm.database.generation=none

compat.jwt.secret=test-secret-key-for-unit-tests
app.production=false
app.super-admin.email=admin@test.com
app.super-admin.password=admin123
app.email-verification.enabled=false
app.password-recovery.enabled=true
