<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <title>Восстановление доступа Супер Админа</title>
</head>

<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
        <h2>Восстановление доступа (Супер Админ)</h2>
        <p>Вы запросили ваши учетные данные супер администратора.</p>
        <div style="background-color: #f5f5f5; padding: 15px; border-radius: 5px; margin: 20px 0;">
            <p style="margin: 0;"><strong>Пароль:</strong> {{password}}</p>
        </div>
        <p>Войти: <a href="{{loginLink}}">{{loginLink}}</a></p>
        <p>Пожалуйста, смените пароль после входа, если подозреваете, что он был скомпрометирован.</p>
    </div>
</body>

</html>
